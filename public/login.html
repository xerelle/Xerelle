<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Log In</title>
<style>
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 40px;
    margin: 0;
  }
  nav { display: flex; justify-content: center; padding: 20px; max-width: 420px; width: 100%; }
  nav img { height: 32px; width: auto; }
  .card { max-width: 420px; width: 100%; }
  h1 { font-size: 24px; margin-bottom: 6px; }
  p.sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 28px; }
  label {
    display: block; font-size: 13px; color: var(--text-tertiary);
    margin-bottom: 6px; margin-top: 16px;
  }
  input {
    width: 100%; box-sizing: border-box;
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; color: var(--text-primary); font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--accent-gold); }
  #submitBtn {
    width: 100%; margin-top: 26px;
    background: var(--accent-gold); color: var(--border-subtle); font-weight: 600;
    padding: 14px; border-radius: 10px; border: none;
    font-size: 15px; cursor: pointer;
  }
  #submitBtn:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }
  #message {
    margin-top: 18px; padding: 12px 14px; border-radius: 8px;
    font-size: 14px; display: none; line-height: 1.5;
  }
  #message.success { background: var(--success-bg); color: var(--accent-green); display: block; }
  #message.error { background: var(--danger-bg); color: var(--danger); display: block; }
  a { color: var(--accent-gold); }
</style>
</head>
<body>
  <nav>
    <a href="/index.html"><img src="/logo.png" alt="Xerelle"></a>
  </nav>
  <button onclick="xerelleGoBack()" style="position:fixed; top:16px; left:16px; z-index:20; background:none; border:none; color:var(--text-primary); cursor:pointer; padding:8px; display:flex;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:22px; height:22px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </button>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Log in with your username or phone number.</p>

    <form id="loginForm">
      <label for="identifier">Username or phone number</label>
      <input type="text" id="identifier" required placeholder="amara.room or +2348012345678">

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <button type="submit" id="submitBtn">Log in</button>
    </form>

    <div id="message"></div>
    <p class="sub" style="margin-top:20px;">No account yet? <a href="/register.html">Create one</a></p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const messageBox = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';
      messageBox.className = '';
      messageBox.textContent = '';

      const body = {
        identifier: document.getElementById('identifier').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch('/api/models/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (!res.ok) {
          messageBox.className = 'error';
          messageBox.textContent = data.error || 'Something went wrong. Please try again.';
        } else {
          // Store session so other pages know who's logged in without
          // asking again, then take her to her own Room — not verify.html,
          // since that should only matter the first time, not every login.
          localStorage.setItem('xerelle_model_session', JSON.stringify(data));
          messageBox.className = 'success';
          messageBox.textContent = `Welcome back, ${data.display_name}! Redirecting...`;
          setTimeout(() => { window.location.href = `/room.html?u=${encodeURIComponent(data.username)}`; }, 1200);
        }
      } catch (err) {
        messageBox.className = 'error';
        messageBox.textContent = 'Could not reach the server. Please check your connection and try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
