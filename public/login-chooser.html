<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xerelle — Log In</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #FFFFFF;
    color: #5C2A3E;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 20px; max-width: 420px; margin: 0 auto; }
  nav img { height: 32px; width: auto; }
  .back-link { color: #8A6B76; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 4px; }
  .container { max-width: 420px; margin: 40px auto 0; padding: 0 20px 60px; text-align: center; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 26px; margin-bottom: 10px; }
  p.sub { color: #8A6B76; font-size: 15px; margin-bottom: 36px; line-height: 1.5; }
  .choice-btn {
    display: block;
    width: 100%;
    padding: 20px;
    border-radius: 14px;
    text-decoration: none;
    margin-bottom: 16px;
    text-align: left;
  }
  .choice-btn.model {
    background: linear-gradient(135deg, #F3DFB0, #D4A24C 45%, #A8762F);
    color: #4A1030;
  }
  .choice-btn.member {
    background: #FFF6F9;
    border: 1px solid #F0C7D9;
    color: #5C2A3E;
  }
  .choice-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .choice-desc { font-size: 13.5px; opacity: 0.85; }
</style>
</head>
<body>
  <nav>
    <a href="/index.html"><img src="/logo.png" alt="Xerelle"></a>
    <a href="/index.html" class="back-link">&larr; Back</a>
  </nav>
  <div class="container">
    <h1>Welcome back</h1>
    <p class="sub">Which kind of account do you have?</p>

    <a class="choice-btn model" href="/login.html">
      <div class="choice-title">I'm a Model</div>
      <div class="choice-desc">Log in to manage your Room, Feed, and messages.</div>
    </a>

    <a class="choice-btn member" href="/subscriber-login.html">
      <div class="choice-title">I'm a Member</div>
      <div class="choice-desc">Log in to message and follow the models you support.</div>
    </a>
  </div>
</body>
</html>
