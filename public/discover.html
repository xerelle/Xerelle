<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Discover</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    margin: 0;
    min-height: 100vh;
  }
  nav { display: flex; justify-content: center; padding: 20px; max-width: 460px; width: 100%; }
  nav img { height: 32px; width: auto; }
  .card { max-width: 460px; width: 100%; }
  .header {
    padding: 24px 20px 8px;
  }
  .header h1 { font-size: 20px; margin: 0 0 4px; }
  .header p { color: var(--text-secondary); font-size: 13px; margin: 0; }

  .model-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 20px;
  }
  .model-card {
    background: var(--bg-surface-alt);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
  }
  .model-photo {
    width: 100%;
    aspect-ratio: 1;
    background: var(--bg-surface);
    object-fit: cover;
    display: block;
  }
  .model-photo-fallback {
    width: 100%;
    aspect-ratio: 1;
    background: var(--bg-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 600;
    color: var(--accent-gold);
  }
  .model-info { padding: 10px 12px 14px; }
  .model-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }

  #loading, #locked, #empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-secondary);
  }
  .locked-box {
    background: rgba(212,162,76,0.1);
    border: 1px solid var(--accent-gold);
    border-radius: 12px;
    padding: 20px;
    color: var(--accent-gold);
    font-size: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <nav>
    <a href="/index.html"><img src="/logo.png" alt="Xerelle"></a>
  </nav>
  <button onclick="xerelleGoBack()" style="position:fixed; top:16px; left:16px; z-index:20; background:var(--bg-surface); border:1px solid var(--border); border-radius:50%; color:var(--text-primary); cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="card">
    <div class="header">
      <h1>Discover</h1>
      <p>Other Rooms you might like.</p>
    </div>

    <div id="loading">Loading...</div>
    <div id="locked" style="display:none; padding: 20px;">
      <div class="locked-box"></div>
    </div>
    <div id="empty" style="display:none;">No suggestions right now — check back soon.</div>
    <div class="model-grid" id="modelGrid"></div>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem('xerelle_subscriber_session') || 'null');
    const loading = document.getElementById('loading');
    const locked = document.getElementById('locked');
    const empty = document.getElementById('empty');
    const modelGrid = document.getElementById('modelGrid');

    async function loadDiscover() {
      if (!session) {
        window.location.href = '/subscriber-login.html';
        return;
      }

      try {
        const res = await fetch('/api/subscribers/discover', {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        const data = await res.json();

        loading.style.display = 'none';

        if (res.status === 403) {
          locked.style.display = 'block';
          locked.querySelector('.locked-box').textContent =
            data.message || 'Discover unlocks once you have an active subscription.';
          return;
        }

        if (!res.ok) {
          locked.style.display = 'block';
          locked.querySelector('.locked-box').textContent = data.error || 'Something went wrong.';
          return;
        }

        if (!data.models || data.models.length === 0) {
          empty.style.display = 'block';
          return;
        }

        data.models.forEach((model) => {
          const card = document.createElement('a');
          card.className = 'model-card';
          card.href = `/room.html?u=${encodeURIComponent(model.username)}`;

          const initial = model.display_name.trim().charAt(0).toUpperCase();
          const nameLabel = model.age ? `${model.display_name}, ${model.age}` : model.display_name;
          const photoHtml = model.teaser_media_url
            ? `<img class="model-photo" src="${window.xerelleEscapeHtml(model.teaser_media_url)}" alt="">`
            : `<div class="model-photo-fallback">${window.xerelleEscapeHtml(initial)}</div>`;

          card.innerHTML = `
            ${photoHtml}
            <div class="model-info">
              <div class="model-name">${window.xerelleEscapeHtml(nameLabel)}</div>
            </div>
          `;
          modelGrid.appendChild(card);
        });
      } catch (err) {
        loading.style.display = 'none';
        locked.style.display = 'block';
        locked.querySelector('.locked-box').textContent = 'Could not reach the server.';
      }
    }

    loadDiscover();
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
