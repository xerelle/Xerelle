<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Profile</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px;
    margin: 0;
    height: 100vh;
    overflow: hidden;
  }
  nav { display: flex; justify-content: center; padding: 20px; max-width: 420px; width: 100%; flex-shrink: 0; }
  nav img { height: 32px; width: auto; }
  .card { max-width: 420px; width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .profile-scroll {
    flex: 1; overflow-y: auto; padding-bottom: 20px;
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* older Edge/IE */
  }
  .profile-scroll::-webkit-scrollbar { display: none; } /* Chrome, Safari */
  .nav-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 12px 0 24px;
    border-top: 1px solid var(--border);
    background: var(--bg-primary);
    flex-shrink: 0;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 11px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .nav-item.active { color: var(--accent-gold); }
  .nav-item svg { width: 22px; height: 22px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  #whoami { color: var(--accent-gold); font-size: 13px; margin-bottom: 28px; }

  .model-avatar-wrap { position: relative; width: 90px; margin: 4px auto 16px; }
  .model-avatar {
    width: 90px; height: 90px; border-radius: 50%;
    background: var(--bg-surface); border: 2px solid var(--border);
    object-fit: cover; display: block; margin: 0 auto;
  }
  .model-avatar-initial {
    width: 90px; height: 90px; border-radius: 50%;
    background: var(--bg-surface); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 600; color: var(--accent-gold);
    margin: 0 auto;
  }
  .model-avatar-edit-badge {
    position: absolute; bottom: 0; right: -2px;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent-gold); color: var(--border-subtle);
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg-primary); cursor: pointer;
  }
  .model-avatar-edit-badge svg { width: 14px; height: 14px; }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .bell-link {
    position: relative;
    color: var(--text-primary);
    text-decoration: none;
  }
  .bell-link svg { width: 24px; height: 24px; }
  .bell-dot {
    display: none;
    position: absolute;
    top: -2px;
    right: -2px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--danger);
    border: 2px solid var(--bg-primary);
  }
  .bell-dot.show { display: block; }

  .section-label {
    color: var(--text-secondary);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 24px 0 10px;
  }
  .profile-link {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .profile-link .arrow { color: var(--text-secondary); font-weight: 400; }
  .profile-link.danger { border-color: var(--danger); color: var(--danger); }

  input[type="file"] { display: none; }

  /* Upload panel — same bottom-sheet pattern used on feed.html/inbox.html */
  .upload-panel {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: flex-end; z-index: 20;
  }
  .upload-sheet {
    background: var(--bg-surface-alt); width: 100%; max-height: 85vh;
    border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
    padding-bottom: 20px;
  }
  .upload-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    color: var(--text-primary); font-weight: 600; font-size: 15px;
  }
  .upload-header button { background: none; border: none; color: var(--text-secondary); font-size: 20px; }
  .upload-body { padding: 16px 20px; overflow-y: auto; }
  .upload-preview {
    width: 100%; height: 220px; border-radius: 12px; overflow: hidden;
    background: var(--bg-surface); display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }
  .upload-preview img, .upload-preview video { width: 100%; height: 100%; object-fit: cover; }
  .upload-caption {
    width: 100%; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; color: var(--text-primary); font-size: 14px; font-family: inherit;
    margin-bottom: 8px;
  }
  .upload-hint { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 18px; }
  .upload-post-btn {
    width: 100%; background: var(--accent-gold); color: var(--border-subtle); font-weight: 700;
    padding: 14px; border-radius: 10px; border: none; font-size: 15px; cursor: pointer;
  }
  .upload-post-btn:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }
  .upload-status { margin-top: 12px; font-size: 13.5px; text-align: center; }
  .upload-status.success { color: var(--accent-green); }
  .upload-status.error { color: var(--danger); }
</style>
</head>
<body>
  <nav>
    <a href="/index.html"><img src="/logo.png" alt="Xerelle"></a>
  </nav>
  <button onclick="xerelleGoBack()" style="position:fixed; top:16px; left:16px; z-index:20; background:var(--bg-surface); border:1px solid var(--border); border-radius:50%; color:var(--text-primary); cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="card">
    <div class="profile-scroll">
      <div class="header-row">
        <h1>Profile</h1>
        <a class="bell-link" href="/model-notifications.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="bell-dot" id="bellDot"></span>
        </a>
      </div>

      <div class="model-avatar-wrap">
        <img class="model-avatar" id="modelAvatarImg" src="" alt="" style="display:none;">
        <div class="model-avatar-initial" id="modelAvatarInitial" style="display:none;"></div>
        <button class="model-avatar-edit-badge" id="modelAvatarEditBadge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>

      <div id="whoami"></div>

      <div class="section-label">Room</div>
      <a class="profile-link" href="/room-settings.html">
        Room settings <span class="arrow">›</span>
      </a>
      <a class="profile-link" href="#" id="previewRoomLink">
        Preview my Room <span class="arrow">›</span>
      </a>

      <div class="section-label">Account</div>
      <a class="profile-link" href="#" onclick="alert('Payment methods — coming soon'); return false;">
        Payment methods <span class="arrow">›</span>
      </a>
      <a class="profile-link" href="/privacy-safety.html">
        Privacy &amp; safety <span class="arrow">›</span>
      </a>
      <a class="profile-link" href="/appearance.html">
        Appearance <span class="arrow">›</span>
      </a>
      <a class="profile-link" href="/change-password.html">
        Change password <span class="arrow">›</span>
      </a>

      <div class="section-label">&nbsp;</div>
      <a class="profile-link danger" href="#" id="logoutBtn">Log out</a>
    </div>

    <div class="nav-bar">
      <a class="nav-item" id="feedNavLink" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Feed
      </a>
      <a class="nav-item" href="/inbox.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Message
      </a>
      <button class="nav-item" id="updateNavItem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="4"/><path d="M4 7h3l2-3h6l2 3h3v13H4z"/></svg>
        Story
      </button>
      <a class="nav-item active" href="/model-profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
        Profile
      </a>
    </div>
  </div>

  <!-- Story upload panel: opened directly by a real tap on Story, so the
       native picker isn't blocked by mobile browsers' restriction on
       auto-triggering file inputs outside a genuine user gesture. -->
  <input type="file" id="storyUploadInput" accept="image/*,video/*">
  <input type="file" id="modelAvatarInput" accept="image/*">
  <div class="upload-panel" id="modelAvatarPanel">
    <div class="upload-sheet">
      <div class="upload-header">
        <span>Change Photo</span>
        <button id="closeModelAvatarUpload">✕</button>
      </div>
      <div class="upload-body" style="text-align:center;">
        <div class="upload-preview" id="modelAvatarPreview" style="width:160px; height:160px; border-radius:50%; margin:0 auto 20px;">
          <span style="color:var(--text-secondary); font-size:13px;">No photo selected</span>
        </div>
        <button class="upload-post-btn" id="modelAvatarPostBtn">Save Photo</button>
        <div class="upload-status" id="modelAvatarStatus"></div>
      </div>
    </div>
  </div>

  <div class="upload-panel" id="uploadPanel">
    <div class="upload-sheet">
      <div class="upload-header">
        <span>Post a Story</span>
        <button id="closeUpload">✕</button>
      </div>
      <div class="upload-body">
        <div class="upload-preview" id="uploadPreview">
          <span style="color:var(--text-secondary); font-size:13px;">No media selected</span>
        </div>
        <input type="text" class="upload-caption" id="uploadCaption" placeholder="What's happening today?" maxlength="200">
        <div class="upload-hint">Visible on your Room for 24 hours, then automatically expires.</div>
        <button class="upload-post-btn" id="uploadPostBtn">Post Story</button>
        <div class="upload-status" id="uploadStatus"></div>
      </div>
    </div>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');
    const whoami = document.getElementById('whoami');

    if (!session) {
      window.location.href = '/login.html';
    } else {
      whoami.textContent = `${session.display_name} (@${session.username})`;
      document.getElementById('feedNavLink').href = `/feed.html?u=${encodeURIComponent(session.username)}`;
      document.getElementById('previewRoomLink').href = `/room.html?u=${encodeURIComponent(session.username)}&preview=true`;
      loadModelAvatar();

      fetch('/api/models/notifications', {
        headers: { 'Authorization': `Bearer ${session.token}` },
      })
        .then((res) => res.json())
        .then((data) => {
          const hasUnread = (data.notifications || []).some((n) => !n.is_read);
          if (hasUnread) {
            document.getElementById('bellDot').classList.add('show');
          }
        })
        .catch(() => {});
    }

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('xerelle_model_session');
      window.location.href = '/login.html';
    });

    // ============ Story upload flow, entirely in-page ============
    const storyUploadInput = document.getElementById('storyUploadInput');
    const uploadPanel = document.getElementById('uploadPanel');
    const uploadPreview = document.getElementById('uploadPreview');
    const uploadCaption = document.getElementById('uploadCaption');
    const uploadPostBtn = document.getElementById('uploadPostBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    let selectedStoryFile = null;

    document.getElementById('updateNavItem').addEventListener('click', () => {
      // A direct tap — a genuine user gesture, so the native picker
      // opens reliably (unlike triggering it from page load).
      storyUploadInput.click();
    });

    storyUploadInput.addEventListener('change', () => {
      const file = storyUploadInput.files[0];
      if (!file) return;
      selectedStoryFile = file;

      const url = URL.createObjectURL(file);
      uploadPreview.innerHTML = file.type.startsWith('video')
        ? `<video src="${url}" muted playsinline controls></video>`
        : `<img src="${url}" alt="">`;

      uploadStatus.textContent = '';
      uploadStatus.className = 'upload-status';
      uploadPanel.style.display = 'flex';
    });

    document.getElementById('closeUpload').addEventListener('click', () => {
      uploadPanel.style.display = 'none';
    });

    uploadPostBtn.addEventListener('click', async () => {
      if (!selectedStoryFile) {
        uploadStatus.className = 'upload-status error';
        uploadStatus.textContent = 'Choose a photo or video first.';
        return;
      }

      uploadPostBtn.disabled = true;
      uploadPostBtn.textContent = 'Posting...';
      uploadStatus.textContent = '';
      uploadStatus.className = 'upload-status';

      const formData = new FormData();
      formData.append('media', selectedStoryFile);
      const caption = uploadCaption.value.trim();
      if (caption) formData.append('caption', caption);

      try {
        const res = await fetch('/api/models/stories/post', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${session.token}` },
          body: formData,
        });
        const data = await res.json();

        if (!res.ok) {
          uploadStatus.className = 'upload-status error';
          uploadStatus.textContent = data.message || data.error || 'Something went wrong.';
          return;
        }

        uploadStatus.className = 'upload-status success';
        uploadStatus.textContent = 'Story posted!';
        selectedStoryFile = null;
        uploadCaption.value = '';
        storyUploadInput.value = '';

        setTimeout(() => {
          uploadPanel.style.display = 'none';
        }, 900);
      } catch (err) {
        uploadStatus.className = 'upload-status error';
        uploadStatus.textContent = 'Could not reach the server.';
      } finally {
        uploadPostBtn.disabled = false;
        uploadPostBtn.textContent = 'Post Story';
      }
    });

    // ============ Main profile photo, entirely in-page ============
    async function loadModelAvatar() {
      try {
        const res = await fetch(`/api/models/${encodeURIComponent(session.username)}`, {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        if (!res.ok) return;
        const data = await res.json();

        const img = document.getElementById('modelAvatarImg');
        const initial = document.getElementById('modelAvatarInitial');
        if (data.teaser_media_url) {
          img.src = data.teaser_media_url;
          img.style.display = 'block';
          initial.style.display = 'none';
        } else {
          initial.textContent = session.display_name.trim().charAt(0).toUpperCase();
          initial.style.display = 'flex';
          img.style.display = 'none';
        }
      } catch (err) {}
    }

    const modelAvatarInput = document.getElementById('modelAvatarInput');
    const modelAvatarPanel = document.getElementById('modelAvatarPanel');
    const modelAvatarPreview = document.getElementById('modelAvatarPreview');
    const modelAvatarPostBtn = document.getElementById('modelAvatarPostBtn');
    const modelAvatarStatus = document.getElementById('modelAvatarStatus');
    let selectedModelAvatarFile = null;

    document.getElementById('modelAvatarEditBadge').addEventListener('click', () => {
      modelAvatarInput.click();
    });

    modelAvatarInput.addEventListener('change', () => {
      const file = modelAvatarInput.files[0];
      if (!file) return;
      selectedModelAvatarFile = file;
      const url = URL.createObjectURL(file);
      modelAvatarPreview.innerHTML = `<img src="${url}" alt="" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
      modelAvatarStatus.textContent = '';
      modelAvatarStatus.className = 'upload-status';
      modelAvatarPanel.style.display = 'flex';
    });

    document.getElementById('closeModelAvatarUpload').addEventListener('click', () => {
      modelAvatarPanel.style.display = 'none';
    });

    modelAvatarPostBtn.addEventListener('click', async () => {
      if (!selectedModelAvatarFile) {
        modelAvatarStatus.className = 'upload-status error';
        modelAvatarStatus.textContent = 'Choose a photo first.';
        return;
      }

      modelAvatarPostBtn.disabled = true;
      modelAvatarPostBtn.textContent = 'Saving...';
      modelAvatarStatus.textContent = '';
      modelAvatarStatus.className = 'upload-status';

      const formData = new FormData();
      formData.append('photo', selectedModelAvatarFile);

      try {
        const res = await fetch('/api/models/avatar/upload', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${session.token}` },
          body: formData,
        });
        const data = await res.json();

        if (!res.ok) {
          modelAvatarStatus.className = 'upload-status error';
          modelAvatarStatus.textContent = data.message || data.error || 'Upload failed.';
          return;
        }

        modelAvatarStatus.className = 'upload-status success';
        modelAvatarStatus.textContent = 'Photo saved!';
        selectedModelAvatarFile = null;
        modelAvatarInput.value = '';
        loadModelAvatar();

        setTimeout(() => {
          modelAvatarPanel.style.display = 'none';
        }, 900);
      } catch (err) {
        modelAvatarStatus.className = 'upload-status error';
        modelAvatarStatus.textContent = 'Could not reach the server.';
      } finally {
        modelAvatarPostBtn.disabled = false;
        modelAvatarPostBtn.textContent = 'Save Photo';
      }
    });
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
