<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Profile</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 20px;
    margin: 0;
  }
  .card { max-width: 420px; width: 100%; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  #whoami { color: var(--accent-gold); font-size: 13px; margin-bottom: 28px; }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .bell-link {
    position: relative;
    color: var(--text-primary);
    text-decoration: none;
  }
  .bell-link svg { width: 24px; height: 24px; }
  .bell-dot {
    display: none;
    position: absolute;
    top: -2px;
    right: -2px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--danger);
    border: 2px solid var(--bg-primary);
  }
  .bell-dot.show { display: block; }

  .section-label {
    color: var(--text-secondary);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 24px 0 10px;
  }
  .profile-link {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .profile-link .arrow { color: var(--text-secondary); font-weight: 400; }
  .profile-link.danger { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>
  <div class="card">
    <div class="header-row">
      <h1>Profile</h1>
      <a class="bell-link" href="/model-notifications.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="bell-dot" id="bellDot"></span>
      </a>
    </div>
    <div id="whoami"></div>

    <div class="section-label">Room</div>
    <a class="profile-link" href="/room-settings.html">
      Room settings <span class="arrow">›</span>
    </a>

    <div class="section-label">Account</div>
    <a class="profile-link" href="#" onclick="alert('Payment methods — coming soon'); return false;">
      Payment methods <span class="arrow">›</span>
    </a>
    <a class="profile-link" href="/privacy-safety.html">
      Privacy &amp; safety <span class="arrow">›</span>
    </a>
    <a class="profile-link" href="/appearance.html">
      Appearance <span class="arrow">›</span>
    </a>
    <a class="profile-link" href="/change-password.html">
      Change password <span class="arrow">›</span>
    </a>

    <div class="section-label">&nbsp;</div>
    <a class="profile-link danger" href="#" id="logoutBtn">Log out</a>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');
    const whoami = document.getElementById('whoami');

    if (!session) {
      whoami.innerHTML = 'You need to <a href="/login.html" style="color:var(--accent-gold);">log in</a> first.';
    } else {
      whoami.textContent = `${session.display_name} (@${session.username})`;

      fetch('/api/models/notifications', {
        headers: { 'Authorization': `Bearer ${session.token}` },
      })
        .then((res) => res.json())
        .then((data) => {
          const hasUnread = (data.notifications || []).some((n) => !n.is_read);
          if (hasUnread) {
            document.getElementById('bellDot').classList.add('show');
          }
        })
        .catch(() => {});
    }

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('xerelle_model_session');
      window.location.href = '/login.html';
    });
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
