<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Earnings</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 0;
    margin: 0;
    height: 100vh;
    overflow: hidden;
  }
  .card { max-width: 460px; width: 100%; height: 100vh; display: flex; flex-direction: column; }
  .earnings-scroll { flex: 1; overflow-y: auto; padding: 64px 20px 32px; }

  .balance-hero {
    background: linear-gradient(135deg, #3A1029, #4A1030 60%, #2B0A1F);
    border-radius: 16px;
    padding: 24px 20px;
    text-align: center;
    margin-bottom: 24px;
  }
  .balance-label { color: rgba(247,240,230,0.7); font-size: 12.5px; margin-bottom: 6px; }
  .balance-amount { color: #F3DFB0; font-size: 32px; font-weight: 700; }
  .withdraw-btn {
    margin-top: 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(247,240,230,0.6);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    cursor: not-allowed;
  }

  .breakdown-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--border-subtle);
  }
  .breakdown-label { font-size: 14px; color: var(--text-primary); }
  .breakdown-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .breakdown-amount { font-size: 15px; font-weight: 700; color: var(--text-primary); }

  .section-title { font-size: 15px; font-weight: 700; margin: 24px 0 12px; }

  .referral-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border-subtle);
  }
  .referral-name { font-size: 13.5px; color: var(--text-primary); }
  .referral-time { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
  .referral-amount { font-size: 13.5px; font-weight: 600; color: var(--accent-green); }

  .empty-note { font-size: 12.5px; color: var(--text-secondary); padding: 12px 0; }
</style>
</head>
<body>
  <button onclick="xerelleGoBack()" style="position:fixed; top:16px; left:16px; z-index:20; background:var(--bg-surface); border:1px solid var(--border); border-radius:50%; color:var(--text-primary); cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;"><path d="M15 18l-6-6 6-6"/></svg>
  </button>

  <div class="card">
    <div class="earnings-scroll">
      <h1 style="font-size:20px; margin:0 0 20px;">Earnings</h1>

      <div class="balance-hero">
        <div class="balance-label">Total balance</div>
        <div class="balance-amount" id="totalBalance">₦0</div>
        <button class="withdraw-btn" disabled>Withdraw — coming soon</button>
      </div>

      <div class="breakdown-row">
        <div>
          <div class="breakdown-label">Subscription revenue</div>
          <div class="breakdown-sub" id="subscriberCountLabel">0 active subscribers</div>
        </div>
        <div class="breakdown-amount" id="subscriptionRevenue">₦0</div>
      </div>

      <div class="breakdown-row">
        <div>
          <div class="breakdown-label">Referral bonuses</div>
          <div class="breakdown-sub">5% of each referred creator's subscription price</div>
        </div>
        <div class="breakdown-amount" id="referralTotal">₦0</div>
      </div>

      <div class="breakdown-row">
        <div>
          <div class="breakdown-label">Milestone bonus</div>
          <div class="breakdown-sub" id="milestoneProgress">0/10 subscribers</div>
        </div>
        <div class="breakdown-amount" id="milestoneTotal">₦0</div>
      </div>

      <div class="section-title">Referral history</div>
      <div id="referralList"></div>
      <div id="referralEmpty" class="empty-note" style="display:none;">No referral bonuses yet — you'll see them here once a creator you referred gains a subscriber.</div>
    </div>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');

    function formatDate(unixSeconds) {
      return new Date(unixSeconds * 1000).toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    async function loadEarnings() {
      if (!session) return;

      try {
        const res = await fetch('/api/models/earnings', {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        const data = await res.json();

        const totalNaira = Math.floor((data.total_balance_kobo || 0) / 100).toLocaleString();
        const subNaira = Math.floor((data.subscription_revenue_kobo || 0) / 100).toLocaleString();
        const refNaira = Math.floor((data.referral_total_kobo || 0) / 100).toLocaleString();

        document.getElementById('totalBalance').textContent = `₦${totalNaira}`;
        document.getElementById('subscriptionRevenue').textContent = `₦${subNaira}`;
        document.getElementById('referralTotal').textContent = `₦${refNaira}`;
        document.getElementById('subscriberCountLabel').textContent =
          `${data.active_subscriber_count || 0} active subscriber${data.active_subscriber_count === 1 ? '' : 's'}`;

        const milestoneNaira = Math.floor((data.milestone_bonus_kobo || 0) / 100).toLocaleString();
        document.getElementById('milestoneTotal').textContent = `₦${milestoneNaira}`;
        document.getElementById('milestoneProgress').textContent =
          `${data.milestone_progress_count || 0}/${data.milestone_cap || 10} subscribers${data.milestone_complete ? ' — complete!' : ''}`;

        const list = document.getElementById('referralList');
        if (!data.referral_entries || data.referral_entries.length === 0) {
          document.getElementById('referralEmpty').style.display = 'block';
        } else {
          data.referral_entries.forEach((r) => {
            const item = document.createElement('div');
            item.className = 'referral-item';
            const amountNaira = Math.floor(r.bonus_amount_kobo / 100).toLocaleString();
            item.innerHTML = `
              <div>
                <div class="referral-name">${r.referred_model_name}</div>
                <div class="referral-time">${formatDate(r.created_at)}</div>
              </div>
              <div class="referral-amount">+₦${amountNaira}</div>
            `;
            list.appendChild(item);
          });
        }
      } catch (err) {
        console.error('Failed to load earnings:', err);
      }
    }

    loadEarnings();
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
