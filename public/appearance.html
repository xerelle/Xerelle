<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xerelle — Appearance</title>
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 20px;
    margin: 0;
    min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }
  .card { max-width: 420px; width: 100%; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p.sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }

  .theme-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .theme-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .theme-option.active {
    border-color: var(--accent-gold);
  }
  .theme-option-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .theme-swatch {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .theme-swatch.light { background: #FFFFFF; }
  .theme-swatch.dark { background: #0F0509; }
  .theme-label { font-size: 15px; font-weight: 600; }
  .theme-desc { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
  .check-icon {
    color: var(--accent-gold);
    font-size: 18px;
    opacity: 0;
  }
  .theme-option.active .check-icon { opacity: 1; }
</style>
</head>
<body>
  <div class="card">
    <h1>Appearance</h1>
    <p class="sub">Choose how Xerelle looks on your device. Light is our default.</p>

    <div class="theme-options">
      <div class="theme-option" id="lightOption">
        <div class="theme-option-left">
          <div class="theme-swatch light"></div>
          <div>
            <div class="theme-label">Light</div>
            <div class="theme-desc">Bright, clean — our default look</div>
          </div>
        </div>
        <span class="check-icon">✓</span>
      </div>

      <div class="theme-option" id="darkOption">
        <div class="theme-option-left">
          <div class="theme-swatch dark"></div>
          <div>
            <div class="theme-label">Dark</div>
            <div class="theme-desc">Easier on the eyes at night</div>
          </div>
        </div>
        <span class="check-icon">✓</span>
      </div>
    </div>
  </div>

  <script src="/theme-toggle.js"></script>
  <script>
    const lightOption = document.getElementById('lightOption');
    const darkOption = document.getElementById('darkOption');

    function refreshSelection() {
      const current = window.xerelleGetTheme();
      lightOption.classList.toggle('active', current === 'light');
      darkOption.classList.toggle('active', current === 'dark');
    }

    lightOption.addEventListener('click', () => {
      window.xerelleSetTheme('light');
      refreshSelection();
    });
    darkOption.addEventListener('click', () => {
      window.xerelleSetTheme('dark');
      refreshSelection();
    });

    refreshSelection();
  </script>
</body>
</html>
