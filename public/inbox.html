<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Inbox</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 0;
    margin: 0;
    height: 100vh;
    overflow: hidden;
  }
  .card { max-width: 460px; width: 100%; height: 100vh; display: flex; flex-direction: column; }
  .header {
    padding: 64px 20px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header h1 { font-size: 20px; margin: 0 0 2px; }
  .header .sub { color: var(--text-secondary); font-size: 13px; }

  .thread-list { padding: 0 0 20px; flex: 1; overflow-y: auto; }
  .nav-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 12px 0 24px;
    border-top: 1px solid var(--border);
    background: var(--bg-primary);
    flex-shrink: 0;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 11px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .nav-item.active { color: var(--accent-gold); }
  .nav-item svg { width: 22px; height: 22px; }
  .thread-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-subtle);
    text-decoration: none;
    color: inherit;
  }
  .thread-item:active { background: var(--bg-surface-alt); }
  .avatar-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    flex-shrink: 0;
    margin-right: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    color: var(--accent-gold);
    overflow: hidden;
  }
  .avatar-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .thread-left { min-width: 0; flex: 1; }
  .thread-phone {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .streak-badge { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; font-size: 12px; font-weight: 600; vertical-align: middle; }
  .streak-badge svg { flex-shrink: 0; }
  .thread-preview {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .thread-preview.you { color: var(--text-tertiary); }
  .thread-time {
    font-size: 11.5px;
    color: var(--text-secondary);
    flex-shrink: 0;
    margin-left: 12px;
  }

  #loading, #empty, #notfound {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-secondary);
  }
  a.plain { color: var(--accent-gold); }

  input[type="file"] { display: none; }

  /* Upload panel — same bottom-sheet pattern used on feed.html, for consistency */
  .upload-panel {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: flex-end; z-index: 20;
  }
  .upload-sheet {
    background: var(--bg-surface-alt); width: 100%; max-height: 85vh;
    border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
    padding-bottom: 20px;
  }
  .upload-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    color: var(--text-primary); font-weight: 600; font-size: 15px;
  }
  .upload-header button { background: none; border: none; color: var(--text-secondary); font-size: 20px; }
  .upload-body { padding: 16px 20px; overflow-y: auto; }
  .upload-preview {
    width: 100%; height: 220px; border-radius: 12px; overflow: hidden;
    background: var(--bg-surface); display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }
  .upload-preview img, .upload-preview video { width: 100%; height: 100%; object-fit: cover; }
  .upload-caption {
    width: 100%; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; color: var(--text-primary); font-size: 14px; font-family: inherit;
    margin-bottom: 8px;
  }
  .upload-hint { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 18px; }
  .upload-post-btn {
    width: 100%; background: var(--accent-gold); color: var(--border-subtle); font-weight: 700;
    padding: 14px; border-radius: 10px; border: none; font-size: 15px; cursor: pointer;
  }
  .upload-post-btn:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }
  .upload-status { margin-top: 12px; font-size: 13.5px; text-align: center; }
  .upload-status.success { color: var(--accent-green); }
  .upload-status.error { color: var(--danger); }
</style>
</head>
<body>
  <button onclick="xerelleGoBack()" style="position:fixed; top:16px; left:16px; z-index:20; background:var(--bg-surface); border:1px solid var(--border); border-radius:50%; color:var(--text-primary); cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="card">
    <div class="header">
      <h1>Inbox</h1>
      <div class="sub" id="whoami"></div>
    </div>

    <div id="loading">Loading...</div>
    <div id="notfound" style="display:none;"></div>
    <div id="empty" style="display:none;">No messages yet. Once a subscriber messages you, their conversation will show up here.</div>
    <div class="thread-list" id="threadList"></div>

    <div class="nav-bar">
      <a class="nav-item" id="feedNavLink" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Feed
      </a>
      <a class="nav-item active" href="/inbox.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Message
      </a>
      <button class="nav-item" id="updateNavItem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="4"/><path d="M4 7h3l2-3h6l2 3h3v13H4z"/></svg>
        Update
      </button>
      <a class="nav-item" href="/model-profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
        Profile
      </a>
    </div>
  </div>

  <!-- Story upload panel: opened directly by a real tap on Update, so the
       native picker isn't blocked by mobile browsers' restriction on
       auto-triggering file inputs outside a genuine user gesture. -->
  <input type="file" id="storyUploadInput" accept="image/*,video/*">
  <div class="upload-panel" id="uploadPanel">
    <div class="upload-sheet">
      <div class="upload-header">
        <span>Post a Story</span>
        <button id="closeUpload">✕</button>
      </div>
      <div class="upload-body">
        <div class="upload-preview" id="uploadPreview">
          <span style="color:var(--text-secondary); font-size:13px;">No media selected</span>
        </div>
        <input type="text" class="upload-caption" id="uploadCaption" placeholder="What's happening today?" maxlength="200">
        <div class="upload-hint">Visible on your Room for 24 hours, then automatically expires.</div>
        <button class="upload-post-btn" id="uploadPostBtn">Post Story</button>
        <div class="upload-status" id="uploadStatus"></div>
      </div>
    </div>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');
    const loading = document.getElementById('loading');
    const notfound = document.getElementById('notfound');
    const empty = document.getElementById('empty');
    const threadList = document.getElementById('threadList');
    const whoami = document.getElementById('whoami');

    function formatTime(unixSeconds) {
      const date = new Date(unixSeconds * 1000);
      const now = new Date();
      const isToday = date.toDateString() === now.toDateString();
      if (isToday) {
        return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      }
      return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    async function loadInbox() {
      if (!session) {
        window.location.href = '/login.html';
        return;
      }
      whoami.textContent = `${session.display_name} (@${session.username})`;
      document.getElementById('feedNavLink').href = `/feed.html?u=${encodeURIComponent(session.username)}`;

      try {
        const res = await fetch('/api/models/inbox', {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        const data = await res.json();

        if (!res.ok) {
          loading.style.display = 'none';
          notfound.textContent = data.message || data.error || 'Something went wrong.';
          notfound.style.display = 'block';
          return;
        }

        loading.style.display = 'none';

        if (!data.threads || data.threads.length === 0) {
          empty.style.display = 'block';
          return;
        }

        data.threads.forEach((thread) => {
          const item = document.createElement('a');
          item.className = 'thread-item';

          const prefix = thread.last_sender_type === 'model' ? 'You: ' : '';
          const initial = thread.subscriber_label.trim().charAt(0).toUpperCase();
          const avatarContent = thread.avatar_url
            ? `<img src="${window.xerelleEscapeHtml(thread.avatar_url)}" alt="">`
            : window.xerelleEscapeHtml(initial);

          item.innerHTML = `
            <div class="avatar-circle">${avatarContent}</div>
            <div class="thread-left">
              <div class="thread-phone">${window.xerelleEscapeHtml(thread.subscriber_label)}${window.renderStreakBadge(thread.streak || 0)}</div>
              <div class="thread-preview ${thread.last_sender_type === 'model' ? 'you' : ''}">${prefix}${window.xerelleEscapeHtml(thread.last_message)}</div>
            </div>
            <div class="thread-time">${formatTime(thread.last_sent_at)}</div>
          `;
          item.href = `/model-chat.html?subscriber=${encodeURIComponent(thread.subscriber_id)}&name=${encodeURIComponent(thread.subscriber_label)}&avatar=${encodeURIComponent(thread.avatar_url || '')}`;
          threadList.appendChild(item);
        });
      } catch (err) {
        loading.style.display = 'none';
        notfound.textContent = 'Could not reach the server.';
        notfound.style.display = 'block';
      }
    }

    // ============ Story upload flow, entirely in-page ============
    const storyUploadInput = document.getElementById('storyUploadInput');
    const uploadPanel = document.getElementById('uploadPanel');
    const uploadPreview = document.getElementById('uploadPreview');
    const uploadCaption = document.getElementById('uploadCaption');
    const uploadPostBtn = document.getElementById('uploadPostBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    let selectedStoryFile = null;

    document.getElementById('updateNavItem').addEventListener('click', () => {
      // A direct tap — a genuine user gesture, so the native picker
      // opens reliably (unlike triggering it from page load).
      storyUploadInput.click();
    });

    storyUploadInput.addEventListener('change', () => {
      const file = storyUploadInput.files[0];
      if (!file) return;
      selectedStoryFile = file;

      const url = URL.createObjectURL(file);
      uploadPreview.innerHTML = file.type.startsWith('video')
        ? `<video src="${url}" muted playsinline controls></video>`
        : `<img src="${url}" alt="">`;

      uploadStatus.textContent = '';
      uploadStatus.className = 'upload-status';
      uploadPanel.style.display = 'flex';
    });

    document.getElementById('closeUpload').addEventListener('click', () => {
      uploadPanel.style.display = 'none';
    });

    uploadPostBtn.addEventListener('click', async () => {
      if (!selectedStoryFile) {
        uploadStatus.className = 'upload-status error';
        uploadStatus.textContent = 'Choose a photo or video first.';
        return;
      }

      uploadPostBtn.disabled = true;
      uploadPostBtn.textContent = 'Posting...';
      uploadStatus.textContent = '';
      uploadStatus.className = 'upload-status';

      const formData = new FormData();
      formData.append('media', selectedStoryFile);
      const caption = uploadCaption.value.trim();
      if (caption) formData.append('caption', caption);

      try {
        const res = await fetch('/api/models/stories/post', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${session.token}` },
          body: formData,
        });
        const data = await res.json();

        if (!res.ok) {
          uploadStatus.className = 'upload-status error';
          uploadStatus.textContent = data.message || data.error || 'Something went wrong.';
          return;
        }

        uploadStatus.className = 'upload-status success';
        uploadStatus.textContent = 'Story posted!';
        selectedStoryFile = null;
        uploadCaption.value = '';
        storyUploadInput.value = '';

        setTimeout(() => {
          uploadPanel.style.display = 'none';
        }, 900);
      } catch (err) {
        uploadStatus.className = 'upload-status error';
        uploadStatus.textContent = 'Could not reach the server.';
      } finally {
        uploadPostBtn.disabled = false;
        uploadPostBtn.textContent = 'Post Story';
      }
    });

    loadInbox();
  </script>
  <script src="/js/streak-icons.js"></script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
