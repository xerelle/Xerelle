<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xerelle — Notifications</title>
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    margin: 0;
    min-height: 100vh;
  }
  nav { display: flex; justify-content: center; padding: 20px; max-width: 460px; width: 100%; }
  nav img { height: 32px; width: auto; }
  .card { max-width: 460px; width: 100%; }
  .header {
    padding: 24px 20px 8px;
  }
  .header h1 { font-size: 20px; margin: 0; }

  .notif-item {
    display: block;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-subtle);
    text-decoration: none;
    color: inherit;
    position: relative;
  }
  .notif-item.unread { background: rgba(212,162,76,0.06); }
  .notif-item.unread::before {
    content: "";
    position: absolute;
    left: 8px;
    top: 20px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-gold);
  }
  .notif-message { font-size: 14px; padding-left: 14px; margin-bottom: 3px; }
  .notif-time { font-size: 11.5px; color: var(--text-secondary); padding-left: 14px; }

  #loading, #empty, #notfound {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-secondary);
  }
</style>
</head>
<body>
  <nav>
    <a href="/index.html"><img src="/logo.png" alt="Xerelle"></a>
  </nav>
  <button onclick="xerelleGoBack()" style="position:fixed; top:16px; left:16px; z-index:20; background:var(--bg-surface); border:1px solid var(--border); border-radius:50%; color:var(--text-primary); cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="card">
    <div class="header"><h1>Notifications</h1></div>

    <div id="loading">Loading...</div>
    <div id="notfound" style="display:none;"></div>
    <div id="empty" style="display:none;">No notifications yet.</div>
    <div id="notifList"></div>
  </div>

  <script src="/theme-toggle.js"></script>
  <script>
    const session = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');
    const loading = document.getElementById('loading');
    const notfound = document.getElementById('notfound');
    const empty = document.getElementById('empty');
    const notifList = document.getElementById('notifList');

    function formatTime(unixSeconds) {
      const date = new Date(unixSeconds * 1000);
      const now = new Date();
      const isToday = date.toDateString() === now.toDateString();
      if (isToday) return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    async function loadNotifications() {
      if (!session) {
        loading.style.display = 'none';
        notfound.textContent = 'Log in first.';
        notfound.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/models/notifications', {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        const data = await res.json();

        loading.style.display = 'none';

        if (!res.ok) {
          notfound.textContent = data.message || data.error || 'Something went wrong.';
          notfound.style.display = 'block';
          return;
        }

        if (!data.notifications || data.notifications.length === 0) {
          empty.style.display = 'block';
          return;
        }

        data.notifications.forEach((notif) => {
          const item = document.createElement('a');
          item.className = `notif-item ${notif.is_read ? '' : 'unread'}`;
          item.href = notif.link || '#';

          item.innerHTML = `
            <div class="notif-message">${notif.message}</div>
            <div class="notif-time">${formatTime(notif.created_at)}</div>
          `;

          if (!notif.is_read) {
            item.addEventListener('click', () => {
              fetch(`/api/models/notifications/${notif.id}/read`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${session.token}` },
              }).catch(() => {});
            });
          }

          notifList.appendChild(item);
        });
      } catch (err) {
        loading.style.display = 'none';
        notfound.textContent = 'Could not reach the server.';
        notfound.style.display = 'block';
      }
    }

    loadNotifications();
  </script>
</body>
</html>
