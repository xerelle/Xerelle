<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Post to Feed</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px;
    margin: 0;
    height: 100vh;
    overflow: hidden;
  }
  nav { display: flex; justify-content: center; padding: 20px; max-width: 420px; width: 100%; flex-shrink: 0; }
  nav img { height: 32px; width: auto; }
  .card { max-width: 420px; width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .feed-post-scroll { flex: 1; overflow-y: auto; padding-bottom: 20px; }
  .nav-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 12px 0 24px;
    border-top: 1px solid var(--border);
    background: var(--bg-primary);
    flex-shrink: 0;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 11px;
  }
  .nav-item.active { color: var(--accent-gold); }
  .nav-item svg { width: 22px; height: 22px; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p.sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
  #whoami { color: var(--accent-gold); font-size: 13px; margin-bottom: 20px; }

  .file-drop {
    width: 100%;
    height: 200px;
    background: var(--bg-surface);
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    margin-bottom: 16px;
    color: var(--text-secondary);
    font-size: 13.5px;
    text-align: center;
    padding: 20px;
  }
  .file-drop img, .file-drop video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  input[type="file"] { display: none; }

  label {
    display: block; font-size: 13px; color: var(--text-tertiary);
    margin-bottom: 6px; margin-top: 16px;
  }
  textarea {
    width: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 70px;
  }
  textarea:focus { outline: none; border-color: var(--accent-gold); }

  .expiry-note {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 8px;
    line-height: 1.5;
  }

  #postBtn {
    width: 100%; margin-top: 26px;
    background: var(--accent-gold); color: var(--border-subtle); font-weight: 600;
    padding: 14px; border-radius: 10px; border: none;
    font-size: 15px; cursor: pointer;
  }
  #postBtn:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }

  #message {
    margin-top: 18px; padding: 12px 14px; border-radius: 8px;
    font-size: 14px; display: none; line-height: 1.5;
  }
  #message.success { background: var(--success-bg); color: var(--accent-green); display: block; }
  #message.error { background: var(--danger-bg); color: var(--danger); display: block; }
</style>
</head>
<body>
  <nav>
    <a href="/index.html"><img src="/logo.png" alt="Xerelle"></a>
  </nav>
  <button onclick="xerelleGoBack()" style="position:fixed; top:16px; left:16px; z-index:20; background:var(--bg-surface); border:1px solid var(--border); border-radius:50%; color:var(--text-primary); cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="card">
    <div class="feed-post-scroll">
      <h1>Post to Feed</h1>
      <p class="sub">Exclusive content only your subscribers can see — stays up for 30 days.</p>
      <div id="whoami"></div>

      <div id="formArea">
        <div class="file-drop" id="mediaDrop">Tap to upload a photo or video</div>
        <input type="file" id="mediaInput" accept="image/*,video/*">

        <label for="caption">Caption (optional)</label>
        <textarea id="caption" placeholder="Say something about this..."></textarea>
        <div class="expiry-note">This post will be visible to your subscribers for 30 days, then automatically expire.</div>

        <button id="postBtn">Post to Feed</button>
      </div>

      <div id="message"></div>
    </div>

    <div class="nav-bar">
      <a class="nav-item active" id="feedNavLink" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Feed
      </a>
      <a class="nav-item" href="/inbox.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Message
      </a>
      <a class="nav-item" href="/post-story.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="4"/><path d="M4 7h3l2-3h6l2 3h3v13H4z"/></svg>
        Update
      </a>
      <a class="nav-item" href="/model-profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
        Profile
      </a>
    </div>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');
    const whoami = document.getElementById('whoami');
    const formArea = document.getElementById('formArea');
    const mediaDrop = document.getElementById('mediaDrop');
    const mediaInput = document.getElementById('mediaInput');
    const postBtn = document.getElementById('postBtn');
    const messageBox = document.getElementById('message');
    let selectedFile = null;

    if (!session) {
      whoami.innerHTML = 'You need to <a href="/login.html" style="color:var(--accent-gold);">log in</a> first.';
      formArea.style.display = 'none';
    } else {
      whoami.textContent = `${session.display_name} (@${session.username})`;
      document.getElementById('feedNavLink').href = `/feed.html?u=${encodeURIComponent(session.username)}`;
    }

    mediaDrop.addEventListener('click', () => mediaInput.click());

    mediaInput.addEventListener('change', () => {
      const file = mediaInput.files[0];
      if (!file) return;
      selectedFile = file;

      const url = URL.createObjectURL(file);
      if (file.type.startsWith('video')) {
        mediaDrop.innerHTML = `<video src="${url}" muted playsinline></video>`;
      } else {
        mediaDrop.innerHTML = `<img src="${url}" alt="">`;
      }
    });

    postBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        messageBox.className = 'error';
        messageBox.textContent = 'Please choose a photo or video first.';
        return;
      }

      postBtn.disabled = true;
      postBtn.textContent = 'Posting...';
      messageBox.className = '';
      messageBox.textContent = '';

      const formData = new FormData();
      formData.append('media', selectedFile);
      formData.append('caption', document.getElementById('caption').value.trim());

      try {
        const res = await fetch('/api/models/feed/post', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${session.token}` },
          body: formData,
        });
        const data = await res.json();

        if (!res.ok) {
          messageBox.className = 'error';
          messageBox.textContent = data.message || data.error || 'Something went wrong.';
          return;
        }

        messageBox.className = 'success';
        messageBox.textContent = 'Posted to your Feed! Your subscribers can see it now.';
        mediaDrop.innerHTML = 'Tap to upload a photo or video';
        document.getElementById('caption').value = '';
        selectedFile = null;
      } catch (err) {
        messageBox.className = 'error';
        messageBox.textContent = 'Could not reach the server.';
      } finally {
        postBtn.disabled = false;
        postBtn.textContent = 'Post to Feed';
      }
    });
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
