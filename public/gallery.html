<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Gallery Photos</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 32px;
    margin: 0;
  }
  nav { display: flex; justify-content: center; padding: 20px; max-width: 420px; width: 100%; }
  nav img { height: 32px; width: auto; }
  .card { max-width: 420px; width: 100%; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p.sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
  #whoami { color: var(--accent-gold); font-size: 13px; margin-bottom: 20px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .slot {
    aspect-ratio: 1 / 1;
    background: var(--bg-surface);
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }
  .slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .slot .plus {
    font-size: 28px;
    color: var(--text-secondary);
  }
  input[type="file"] { display: none; }

  #message {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
    line-height: 1.5;
  }
  #message.success { background: var(--success-bg); color: var(--accent-green); display: block; }
  #message.error { background: var(--danger-bg); color: var(--danger); display: block; }
  a { color: var(--accent-gold); }
</style>
</head>
<body>
  <nav>
    <a href="/index.html"><img src="/logo.png" alt="Xerelle"></a>
  </nav>
  <button onclick="xerelleGoBack()" style="position:fixed; top:16px; left:16px; z-index:20; background:var(--bg-surface); border:1px solid var(--border); border-radius:50%; color:var(--text-primary); cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="card">
    <h1>Gallery photos</h1>
    <p class="sub">Add up to 4 photos subscribers can browse from your Room, so they know exactly who they're talking to.</p>
    <div id="whoami"></div>

    <div class="grid" id="grid">
      <div class="slot" data-index="0"><span class="plus">+</span></div>
      <div class="slot" data-index="1"><span class="plus">+</span></div>
      <div class="slot" data-index="2"><span class="plus">+</span></div>
      <div class="slot" data-index="3"><span class="plus">+</span></div>
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <div id="message"></div>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');
    const whoami = document.getElementById('whoami');
    const grid = document.getElementById('grid');
    const fileInput = document.getElementById('fileInput');
    const messageBox = document.getElementById('message');

    if (!session) {
      whoami.innerHTML = 'You need to <a href="/login.html">log in</a> first.';
      grid.style.display = 'none';
    } else {
      whoami.textContent = `Uploading as: ${session.display_name} (@${session.username})`;
    }

    let activeSlotIndex = null;

    document.querySelectorAll('.slot').forEach((slot) => {
      slot.addEventListener('click', () => {
        if (slot.classList.contains('filled')) return;
        activeSlotIndex = slot.dataset.index;
        fileInput.click();
      });
    });

    fileInput.addEventListener('change', async () => {
      if (!fileInput.files.length || activeSlotIndex === null) return;
      const file = fileInput.files[0];
      const slot = document.querySelector(`.slot[data-index="${activeSlotIndex}"]`);

      messageBox.className = '';
      messageBox.textContent = '';

      const formData = new FormData();
      formData.append('photo', file);

      try {
        const res = await fetch('/api/models/gallery/upload', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${session.token}` },
          body: formData,
        });
        const data = await res.json();

        if (!res.ok) {
          messageBox.className = 'error';
          messageBox.textContent = data.message || data.error || 'Upload failed.';
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          slot.innerHTML = `<img src="${e.target.result}" alt="">`;
          slot.classList.add('filled');
        };
        reader.readAsDataURL(file);

        messageBox.className = 'success';
        messageBox.textContent = 'Photo uploaded.';
      } catch (err) {
        messageBox.className = 'error';
        messageBox.textContent = 'Could not reach the server.';
      } finally {
        fileInput.value = '';
        activeSlotIndex = null;
      }
    });
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
