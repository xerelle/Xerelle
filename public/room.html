<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xerelle — Room</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0F0509;
    color: #F7F0E6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    margin: 0;
    min-height: 100vh;
  }
  .card {
    max-width: 460px;
    width: 100%;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .top-section {
    padding: 32px 20px 0;
    text-align: center;
  }

  .avatar {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: #3A1029;
    border: 2px solid #4A1E36;
    object-fit: cover;
    display: block;
    margin: 0 auto 8px;
    cursor: pointer;
  }
  .view-photos-hint {
    color: #9C8791;
    font-size: 12px;
    margin-bottom: 20px;
  }

  h1 { font-size: 20px; margin: 0 0 2px; }
  .username { color: #9C8791; font-size: 14px; margin-bottom: 28px; }

  .stats {
    display: flex;
    justify-content: center;
    gap: 44px;
    margin-bottom: 28px;
    font-size: 13px;
    color: #C9B8BF;
  }
  .stats b {
    color: #F7F0E6;
    display: block;
    font-size: 20px;
    margin-bottom: 3px;
  }

  .action-row {
    display: flex;
    gap: 10px;
    max-width: 340px;
    margin: 0 auto;
  }
  .btn-secondary {
    flex: 1;
    background: #3A1029;
    border: 1px solid #4A1E36;
    color: #F7F0E6;
    padding: 13px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-secondary.active {
    border-color: #D4A24C;
    color: #D4A24C;
  }

  .spacer { flex: 1; min-height: 24px; }

  .bottom-section {
    padding: 0 20px 32px;
  }
  .btn-message {
    display: block;
    width: 100%;
    background: #3A1029;
    border: 1px solid #D4A24C;
    color: #D4A24C;
    padding: 14px;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    margin-bottom: 12px;
  }
  .btn-primary {
    width: 100%;
    background: #D4A24C;
    color: #2B0A1F;
    font-weight: 600;
    padding: 15px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    cursor: pointer;
  }
  #message {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    text-align: center;
  }
  #message.error {
    background: rgba(232,139,155,0.15);
    color: #E88B9B;
    display: block;
  }
  #loading, #notfound {
    padding: 60px 20px;
    text-align: center;
    color: #9C8791;
  }

  /* Photo viewer overlay */
  .viewer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .viewer-overlay.open { display: flex; }
  .viewer-img {
    max-width: 92vw;
    max-height: 70vh;
    border-radius: 8px;
    object-fit: contain;
  }
  .viewer-nav {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-top: 20px;
  }
  .viewer-nav button {
    background: #3A1029;
    border: 1px solid #4A1E36;
    color: #F7F0E6;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
  }
  .viewer-counter {
    color: #9C8791;
    font-size: 13px;
  }
  .viewer-close {
    position: absolute;
    top: 24px;
    right: 24px;
    background: none;
    border: none;
    color: #F7F0E6;
    font-size: 28px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div id="loading">Loading...</div>
    <div id="notfound" style="display:none;"></div>

    <div id="profileContent" style="display:none; flex-direction:column; flex:1;">
      <div class="top-section">
        <img class="avatar" id="teaserImg" src="" alt="">
        <div class="view-photos-hint" id="photoHint" style="display:none;">Tap photo to view more</div>
        <h1 id="displayName"></h1>
        <div class="username" id="usernameLabel"></div>

        <div class="stats">
          <span><b id="followerCount">0</b>followers</span>
          <span><b id="likeCount">0</b>likes</span>
        </div>

        <div class="action-row">
          <button class="btn-secondary" id="followBtn">Follow</button>
          <button class="btn-secondary" id="likeBtn">Like</button>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="bottom-section">
        <a class="btn-message" id="messageBtn" href="#">Send a message</a>
        <button class="btn-primary" id="subscribeBtn">Subscribe — ₦10,000/mo</button>
        <div id="message"></div>
      </div>
    </div>
  </div>

  <div class="viewer-overlay" id="viewerOverlay">
    <button class="viewer-close" id="viewerClose">&times;</button>
    <img class="viewer-img" id="viewerImg" src="" alt="">
    <div class="viewer-nav">
      <button id="viewerPrev">&larr;</button>
      <span class="viewer-counter" id="viewerCounter"></span>
      <button id="viewerNext">&rarr;</button>
    </div>
  </div>

  <script>
    const username = new URLSearchParams(window.location.search).get('u');
    const session = JSON.parse(localStorage.getItem('xerelle_subscriber_session') || 'null');

    const loading = document.getElementById('loading');
    const notfound = document.getElementById('notfound');
    const profileContent = document.getElementById('profileContent');
    const messageBox = document.getElementById('message');

    let currentModelUsername = username;
    let allPhotos = [];
    let currentPhotoIndex = 0;

    if (!username) {
      loading.style.display = 'none';
      notfound.textContent = 'No model specified. Use a link like room.html?u=hername';
      notfound.style.display = 'block';
    }

    async function loadProfile() {
      try {
        const headers = {};
        if (session) headers['Authorization'] = `Bearer ${session.token}`;

        const res = await fetch(`/api/models/${encodeURIComponent(username)}`, { headers });
        if (!res.ok) {
          loading.style.display = 'none';
          notfound.style.display = 'block';
          return;
        }
        const data = await res.json();

        document.getElementById('displayName').textContent = data.display_name;
        document.getElementById('usernameLabel').textContent = `@${data.username}`;
        document.getElementById('followerCount').textContent = data.follower_count;
        document.getElementById('likeCount').textContent = data.like_count;
        document.getElementById('messageBtn').href = `/chat.html?u=${encodeURIComponent(data.username)}`;

        const teaserImg = document.getElementById('teaserImg');
        if (data.teaser_media_url) {
          teaserImg.src = data.teaser_media_url;
        }

        allPhotos = [data.teaser_media_url, ...(data.gallery_photos || [])].filter(Boolean);
        if (allPhotos.length > 0) {
          document.getElementById('photoHint').style.display = 'block';
        }

        const followBtn = document.getElementById('followBtn');
        const likeBtn = document.getElementById('likeBtn');
        if (data.viewer_is_following) {
          followBtn.textContent = 'Following';
          followBtn.classList.add('active');
        }
        if (data.viewer_has_liked) {
          likeBtn.textContent = 'Liked';
          likeBtn.classList.add('active');
        }

        loading.style.display = 'none';
        profileContent.style.display = 'flex';
      } catch (err) {
        loading.style.display = 'none';
        notfound.style.display = 'block';
      }
    }

    async function toggleAction(action, btn, countEl, activeLabel, inactiveLabel) {
      if (!session) {
        messageBox.className = 'error';
        messageBox.textContent = 'Log in as a subscriber first to do that.';
        return;
      }
      try {
        const res = await fetch(`/api/models/${encodeURIComponent(currentModelUsername)}/${action}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        const data = await res.json();
        if (!res.ok) {
          messageBox.className = 'error';
          messageBox.textContent = data.message || data.error || 'Something went wrong.';
          return;
        }
        messageBox.className = '';
        messageBox.textContent = '';

        if (action === 'follow') {
          btn.textContent = data.following ? activeLabel : inactiveLabel;
          btn.classList.toggle('active', data.following);
          countEl.textContent = data.follower_count;
        } else {
          btn.textContent = data.liked ? activeLabel : inactiveLabel;
          btn.classList.toggle('active', data.liked);
          countEl.textContent = data.like_count;
        }
      } catch (err) {
        messageBox.className = 'error';
        messageBox.textContent = 'Could not reach the server.';
      }
    }

    document.getElementById('followBtn').addEventListener('click', () => {
      toggleAction('follow', document.getElementById('followBtn'), document.getElementById('followerCount'), 'Following', 'Follow');
    });
    document.getElementById('likeBtn').addEventListener('click', () => {
      toggleAction('like', document.getElementById('likeBtn'), document.getElementById('likeCount'), 'Liked', 'Like');
    });
    document.getElementById('subscribeBtn').addEventListener('click', () => {
      messageBox.className = 'error';
      messageBox.textContent = 'Checkout isn\'t wired up on this page yet — coming soon.';
    });

    // Photo viewer
    const viewerOverlay = document.getElementById('viewerOverlay');
    const viewerImg = document.getElementById('viewerImg');
    const viewerCounter = document.getElementById('viewerCounter');

    function openViewer(index) {
      if (allPhotos.length === 0) return;
      currentPhotoIndex = index;
      renderViewer();
      viewerOverlay.classList.add('open');
    }
    function renderViewer() {
      viewerImg.src = allPhotos[currentPhotoIndex];
      viewerCounter.textContent = `${currentPhotoIndex + 1} / ${allPhotos.length}`;
    }
    function closeViewer() {
      viewerOverlay.classList.remove('open');
    }

    document.getElementById('teaserImg').addEventListener('click', () => openViewer(0));
    document.getElementById('viewerClose').addEventListener('click', closeViewer);
    document.getElementById('viewerPrev').addEventListener('click', () => {
      currentPhotoIndex = (currentPhotoIndex - 1 + allPhotos.length) % allPhotos.length;
      renderViewer();
    });
    document.getElementById('viewerNext').addEventListener('click', () => {
      currentPhotoIndex = (currentPhotoIndex + 1) % allPhotos.length;
      renderViewer();
    });
    viewerOverlay.addEventListener('click', (e) => {
      if (e.target === viewerOverlay) closeViewer();
    });

    if (username) {
      loadProfile();
    }
  </script>
</body>
</html>
