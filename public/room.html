<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Room</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    min-height: 100vh;
  }
  body.self-view-mode {
    height: 100vh;
    min-height: 0;
    overflow: hidden;
  }
  nav { display: flex; justify-content: center; padding: 20px; max-width: 460px; width: 100%; }
  nav img { height: 32px; width: auto; }
  .card {
    max-width: 460px;
    width: 100%;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  body.self-view-mode .card {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  body.self-view-mode #profileContent {
    min-height: 0;
    overflow: hidden;
  }
  body.self-view-mode #selfViewScroll {
    flex: 1;
    overflow-y: auto;
    padding-top: 56px;
  }
  body.self-view-mode .spacer {
    display: none;
  }
  body.self-view-mode .nav-bar {
    flex-shrink: 0;
  }

  .top-section {
    padding: 32px 20px 0;
    text-align: center;
  }

  .avatar-wrap {
    position: relative;
    width: 108px;
    margin: 0 auto 8px;
  }
  .avatar {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: var(--bg-surface);
    border: 2px solid var(--border);
    object-fit: cover;
    display: block;
    cursor: pointer;
  }
  .avatar-plus {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent-gold);
    color: var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    text-decoration: none;
    border: 3px solid var(--bg-primary);
    cursor: pointer;
  }
  .view-photos-hint {
    color: var(--text-secondary);
    font-size: 12px;
    margin-bottom: 20px;
  }

  h1 { font-size: 20px; margin: 0 0 2px; }
  .username { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }

  .relation-status {
    max-width: 320px;
    margin: 0 auto 28px;
    text-align: center;
  }
  .relation-line {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .relation-line.active {
    color: var(--text-primary);
    font-weight: 600;
  }

  .action-row {
    display: flex;
    gap: 10px;
    max-width: 340px;
    margin: 0 auto;
  }
  .btn-secondary {
    flex: 1;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 13px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-secondary.active {
    border-color: var(--accent-gold);
    color: var(--accent-gold);
  }

  .spacer { flex: 1; min-height: 24px; }

  .bottom-section {
    padding: 0 20px 32px;
  }
  .btn-message {
    display: block;
    width: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--accent-gold);
    color: var(--accent-gold);
    padding: 14px;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    margin-bottom: 12px;
  }
  .btn-primary {
    width: 100%;
    background: var(--accent-gold);
    color: var(--border-subtle);
    font-weight: 600;
    padding: 15px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    cursor: pointer;
  }
  #message {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    text-align: center;
  }
  #message.error {
    background: var(--danger-bg);
    color: var(--danger);
    display: block;
  }
  #loading, #notfound {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-secondary);
  }

  /* Photo viewer overlay */
  .viewer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .viewer-overlay.open { display: flex; }
  .viewer-img {
    max-width: 92vw;
    max-height: 70vh;
    border-radius: 8px;
    object-fit: contain;
  }
  .viewer-nav {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-top: 20px;
  }
  .viewer-nav button {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
  }
  .viewer-counter { color: var(--text-secondary); font-size: 13px; }
  .viewer-close {
    position: absolute;
    top: 24px;
    right: 24px;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 28px;
    cursor: pointer;
  }

  /* Bottom nav bar (model self-view) */
  .self-view-header {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .balance-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 12px 6px 10px;
    color: var(--text-primary);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 600;
  }
  .balance-chip svg { width: 15px; height: 15px; color: var(--accent-gold); }
  .bell-link {
    position: relative;
    color: var(--text-primary);
    text-decoration: none;
  }
  .bell-link svg { width: 24px; height: 24px; }
  .bell-dot {
    display: none;
    position: absolute;
    top: -2px;
    right: -2px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--danger);
    border: 2px solid var(--bg-primary);
  }
  .bell-dot.show { display: block; }
  .call-icons { display: flex; gap: 12px; }
  .call-icon-btn {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-primary);
    cursor: pointer;
  }
  .call-icon-btn svg { width: 18px; height: 18px; }

  .self-view-section { padding: 8px 20px 20px; }
  .self-view-section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .self-view-section-title { font-size: 15px; font-weight: 700; }
  .self-view-see-all { font-size: 12.5px; color: var(--accent-gold); text-decoration: none; }

  .activity-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  .activity-avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--bg-surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--accent-gold); flex-shrink: 0;
  }
  .activity-text { font-size: 13.5px; flex: 1; color: var(--text-primary); }
  .activity-text b { color: var(--text-primary); }
  .activity-icon { color: var(--danger); flex-shrink: 0; }
  .activity-icon svg { width: 16px; height: 16px; }
  .activity-icon.follow-icon { color: var(--accent-green); }

  .msg-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--border-subtle);
    text-decoration: none;
  }
  .msg-avatar {
    width: 44px; height: 44px; border-radius: 50%; background: var(--bg-surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: var(--accent-gold); flex-shrink: 0;
    overflow: hidden;
  }
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg-info { flex: 1; min-width: 0; }
  .msg-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; color: var(--text-primary); }
  .msg-preview { font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg-time { font-size: 11px; color: var(--text-secondary); flex-shrink: 0; }
  .self-view-empty { font-size: 12.5px; color: var(--text-secondary); padding: 8px 0; }

  .nav-bar {
    display: none;
    justify-content: space-around;
    align-items: center;
    padding: 12px 0 24px;
    border-top: 1px solid var(--border);
    background: var(--bg-primary);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 11px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .nav-item svg { width: 22px; height: 22px; }
  .nav-item.active { color: var(--accent-gold); }

  input[type="file"] { display: none; }

  /* Upload panel — same bottom-sheet pattern used on feed.html/inbox.html/model-profile.html */
  .upload-panel {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: flex-end; z-index: 25;
  }
  .upload-sheet {
    background: var(--bg-surface-alt); width: 100%; max-height: 85vh;
    border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
    padding-bottom: 20px;
  }
  .upload-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    color: var(--text-primary); font-weight: 600; font-size: 15px;
  }
  .upload-header button { background: none; border: none; color: var(--text-secondary); font-size: 20px; }
  .upload-body { padding: 16px 20px; overflow-y: auto; }
  .upload-preview {
    width: 100%; height: 220px; border-radius: 12px; overflow: hidden;
    background: var(--bg-surface); display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }
  .upload-preview img, .upload-preview video { width: 100%; height: 100%; object-fit: cover; }
  .upload-caption {
    width: 100%; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; color: var(--text-primary); font-size: 14px; font-family: inherit;
    margin-bottom: 8px;
  }
  .upload-hint { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 18px; }
  .upload-post-btn {
    width: 100%; background: var(--accent-gold); color: var(--border-subtle); font-weight: 700;
    padding: 14px; border-radius: 10px; border: none; font-size: 15px; cursor: pointer;
  }
  .upload-post-btn:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }
  .upload-status { margin-top: 12px; font-size: 13.5px; text-align: center; }
  .upload-status.success { color: var(--accent-green); }
  .upload-status.error { color: var(--danger); }
</style>
</head>
<body>
  <nav>
    <a href="/index.html"><img src="/logo.png" alt="Xerelle"></a>
  </nav>
  <button onclick="xerelleGoBack()" style="position:fixed; top:16px; left:16px; z-index:20; background:var(--bg-surface); border:1px solid var(--border); border-radius:50%; color:var(--text-primary); cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="card">
    <div id="loading">Loading...</div>
    <div id="notfound" style="display:none;"></div>

    <div id="profileContent" style="display:none; flex-direction:column; flex:1;">
      <div id="selfViewScroll" style="display:none;">
        <div class="self-view-header" id="selfViewHeader">
          <a class="balance-chip" href="/earnings.html" id="balanceChip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>
            <span id="balanceChipAmount">₦0</span>
          </a>
          <a class="bell-link" href="/model-notifications.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="bell-dot" id="bellDot"></span>
          </a>
        </div>

        <div id="selfViewSections">
          <div class="self-view-section">
            <div class="self-view-section-header">
              <div class="self-view-section-title">Activity</div>
            </div>
            <div id="activitiesList"></div>
            <div id="activitiesEmpty" class="self-view-empty" style="display:none;">No activity yet — once someone follows or likes your Room, it'll show up here.</div>
          </div>

          <div class="self-view-section">
            <div class="self-view-section-header">
              <div class="self-view-section-title">Messages</div>
              <a class="self-view-see-all" href="/inbox.html">See all</a>
            </div>
            <div id="messagesList"></div>
            <div id="messagesEmpty" class="self-view-empty" style="display:none;">No messages yet.</div>
          </div>
        </div>
      </div>

      <div class="top-section" id="topSection">
        <div class="avatar-wrap">
          <img class="avatar" id="teaserImg" src="" alt="">
          <button class="avatar-plus" id="avatarPlus" style="display:none;">+</button>
        </div>
        <div class="view-photos-hint" id="photoHint" style="display:none;">Tap photo to view more</div>

        <h1 id="displayName"></h1>
        <div class="username" id="usernameLabel"></div>

        <div class="relation-status">
          <div class="relation-line" id="followStatus"></div>
          <div class="relation-line" id="likeStatus"></div>
        </div>

        <div class="action-row" id="actionRow">
          <button class="btn-secondary" id="followBtn">Follow</button>
          <button class="btn-secondary" id="likeBtn">Like</button>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="bottom-section" id="bottomSection">
        <a class="btn-message" id="messageBtn" href="#">Send a message</a>
        <a class="btn-message" id="feedLinkBtn" href="#">View Feed</a>
        <button class="btn-primary" id="subscribeBtn">Subscribe</button>
        <div id="message"></div>
      </div>

      <div class="nav-bar" id="navBar">
        <a class="nav-item" id="feedNavLink" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          Feed
        </a>
        <a class="nav-item" href="/inbox.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Message
        </a>
        <button class="nav-item" id="updateNavItem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="4"/><path d="M4 7h3l2-3h6l2 3h3v13H4z"/></svg>
          Story
        </button>
        <a class="nav-item" href="/model-profile.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
          Profile
        </a>
      </div>
    </div>
  </div>

  <div class="viewer-overlay" id="viewerOverlay">
    <button class="viewer-close" id="viewerClose">&times;</button>
    <img class="viewer-img" id="viewerImg" src="" alt="">
    <div class="viewer-nav">
      <button id="viewerPrev">&larr;</button>
      <span class="viewer-counter" id="viewerCounter"></span>
      <button id="viewerNext">&rarr;</button>
    </div>
  </div>

  <!-- Story upload panel: opened directly by a real tap on Story, so the
       native picker isn't blocked by mobile browsers' restriction on
       auto-triggering file inputs outside a genuine user gesture. -->
  <input type="file" id="storyUploadInput" accept="image/*,video/*">
  <div class="upload-panel" id="uploadPanel">
    <div class="upload-sheet">
      <div class="upload-header">
        <span>Post a Story</span>
        <button id="closeUpload">✕</button>
      </div>
      <div class="upload-body">
        <div class="upload-preview" id="uploadPreview">
          <span style="color:var(--text-secondary); font-size:13px;">No media selected</span>
        </div>
        <input type="text" class="upload-caption" id="uploadCaption" placeholder="What's happening today?" maxlength="200">
        <div class="upload-hint">Visible on your Room for 24 hours, then automatically expires.</div>
        <button class="upload-post-btn" id="uploadPostBtn">Post Story</button>
        <div class="upload-status" id="uploadStatus"></div>
      </div>
    </div>
  </div>

  <script>
    const username = new URLSearchParams(window.location.search).get('u');
    const subscriberSession = JSON.parse(localStorage.getItem('xerelle_subscriber_session') || 'null');
    const modelSession = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');

    const loading = document.getElementById('loading');
    const notfound = document.getElementById('notfound');
    const profileContent = document.getElementById('profileContent');
    const messageBox = document.getElementById('message');

    let currentModelUsername = username;
    let allPhotos = [];
    let currentPhotoIndex = 0;
    let isOwnPage = false;
    let currentModelDisplayName = '';
    let currentModelId = '';
    let modelLikesViewer = false;

    if (!username) {
      loading.style.display = 'none';
      notfound.textContent = 'No model specified. Use a link like room.html?u=hername';
      notfound.style.display = 'block';
    }

    async function loadProfile() {
      try {
        const headers = {};
        if (subscriberSession) headers['Authorization'] = `Bearer ${subscriberSession.token}`;

        const res = await fetch(`/api/models/${encodeURIComponent(username)}`, { headers });
        if (!res.ok) {
          loading.style.display = 'none';
          notfound.style.display = 'block';
          return;
        }
        const data = await res.json();

        // ?preview=true forces the public view even for the owner —
        // lets a model see her own Room the way a subscriber actually
        // sees it (Follow/Like buttons, relational status text), since
        // she'd otherwise only ever see her self-view dashboard here.
        const isPreview = new URLSearchParams(window.location.search).get('preview') === 'true';
        isOwnPage = modelSession && modelSession.username === data.username && !isPreview;

        document.getElementById('displayName').textContent = data.age
          ? `${data.display_name}, ${data.age}`
          : data.display_name;
        document.getElementById('usernameLabel').textContent = `@${data.username}`;
        currentModelDisplayName = data.display_name;
        currentModelId = data.id;
        modelLikesViewer = !!data.model_likes_you;

        const priceNaira = ((data.subscription_price_kobo || 1000000) / 100).toLocaleString();
        document.getElementById('subscribeBtn').textContent = `Subscribe — ₦${priceNaira}/mo`;
        document.getElementById('messageBtn').href = `/chat.html?u=${encodeURIComponent(data.username)}`;
        document.getElementById('feedLinkBtn').href = `/feed.html?u=${encodeURIComponent(data.username)}`;

        const teaserImg = document.getElementById('teaserImg');
        if (data.teaser_media_url) {
          teaserImg.src = data.teaser_media_url;
        }

        allPhotos = [data.teaser_media_url, ...(data.gallery_photos || [])].filter(Boolean);
        if (allPhotos.length > 0) {
          document.getElementById('photoHint').style.display = 'block';
        }

        if (isOwnPage) {
          // Self-view: no photo box anymore — this is now an activity
          // dashboard (recent Activity + Messages), not a mirror of the
          // public profile page. Also switches to a fixed, app-style
          // layout so the nav bar stays pinned and only the middle
          // content scrolls — the public view below doesn't need this.
          document.body.classList.add('self-view-mode');
          document.getElementById('navBar').style.display = 'flex';
          document.getElementById('selfViewScroll').style.display = 'block';
          document.getElementById('topSection').style.display = 'none';
          document.getElementById('feedNavLink').href = `/feed.html?u=${encodeURIComponent(modelSession.username)}`;

          fetch('/api/models/notifications', {
            headers: { 'Authorization': `Bearer ${modelSession.token}` },
          })
            .then((res) => res.json())
            .then((data) => {
              const hasUnread = (data.notifications || []).some((n) => !n.is_read);
              if (hasUnread) {
                document.getElementById('bellDot').classList.add('show');
              }
            })
            .catch(() => {});

          loadActivities(modelSession);
          loadRecentMessages(modelSession);
          loadBalance(modelSession);

          document.getElementById('bottomSection').style.display = 'none';
        } else {
          const followBtn = document.getElementById('followBtn');
          const likeBtn = document.getElementById('likeBtn');
          if (data.viewer_is_following) {
            followBtn.textContent = 'Following';
            followBtn.classList.add('active');
          }
          if (data.viewer_has_liked) {
            likeBtn.textContent = 'Liked';
            likeBtn.classList.add('active');
          }
          renderRelationStatus(data.viewer_is_following, data.viewer_has_liked);
        }

        loading.style.display = 'none';
        profileContent.style.display = 'flex';
      } catch (err) {
        loading.style.display = 'none';
        notfound.style.display = 'block';
      }
    }

    function timeAgo(unixSeconds) {
      const diff = Math.floor(Date.now() / 1000) - unixSeconds;
      if (diff < 60) return 'now';
      if (diff < 3600) return `${Math.floor(diff / 60)}m`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
      return `${Math.floor(diff / 86400)}d`;
    }

    async function loadActivities(session) {
      const list = document.getElementById('activitiesList');
      const empty = document.getElementById('activitiesEmpty');
      try {
        const res = await fetch('/api/models/activities', {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        const data = await res.json();

        if (!data.activities || data.activities.length === 0) {
          empty.style.display = 'block';
          return;
        }

        data.activities.forEach((a) => {
          const item = document.createElement('div');
          item.className = 'activity-item';
          const initial = a.subscriber_name.trim().charAt(0).toUpperCase();
          const verb = a.type === 'follow' ? 'followed you' : 'liked your Room';
          const iconClass = a.type === 'follow' ? 'follow-icon' : '';
          const icon = a.type === 'follow'
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>';

          item.innerHTML = `
            <div class="activity-avatar">${window.xerelleEscapeHtml(initial)}</div>
            <div class="activity-text"><b>${window.xerelleEscapeHtml(a.subscriber_name)}</b> ${verb}</div>
            <div class="activity-icon ${iconClass}">${icon}</div>
          `;
          list.appendChild(item);
        });
      } catch (err) {
        empty.textContent = 'Could not load activity.';
        empty.style.display = 'block';
      }
    }

    async function loadBalance(session) {
      try {
        const res = await fetch('/api/models/earnings', {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        const data = await res.json();
        const naira = Math.floor((data.total_balance_kobo || 0) / 100).toLocaleString();
        document.getElementById('balanceChipAmount').textContent = `₦${naira}`;
      } catch (err) {
        // Balance chip silently stays at ₦0 if this fails — not worth
        // showing an error state for a small header element.
      }
    }

    async function loadRecentMessages(session) {
      const list = document.getElementById('messagesList');
      const empty = document.getElementById('messagesEmpty');
      try {
        const res = await fetch('/api/models/inbox', {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        const data = await res.json();

        if (!data.threads || data.threads.length === 0) {
          empty.style.display = 'block';
          return;
        }

        data.threads.slice(0, 5).forEach((t) => {
          const item = document.createElement('a');
          item.className = 'msg-item';
          item.href = `/model-chat.html?subscriber=${encodeURIComponent(t.subscriber_id)}&name=${encodeURIComponent(t.subscriber_label)}&avatar=${encodeURIComponent(t.avatar_url || '')}`;
          const initial = (t.subscriber_label || '?').trim().charAt(0).toUpperCase();
          const preview = t.last_sender_type === 'model' ? `You: ${t.last_message}` : t.last_message;
          const avatarHtml = t.avatar_url
            ? `<img src="${window.xerelleEscapeHtml(t.avatar_url)}" alt="">`
            : window.xerelleEscapeHtml(initial);

          item.innerHTML = `
            <div class="msg-avatar">${avatarHtml}</div>
            <div class="msg-info">
              <div class="msg-name">${window.xerelleEscapeHtml(t.subscriber_label)}</div>
              <div class="msg-preview">${window.xerelleEscapeHtml(preview || '')}</div>
            </div>
            <div class="msg-time">${timeAgo(t.last_sent_at)}</div>
          `;
          list.appendChild(item);
        });
      } catch (err) {
        empty.textContent = 'Could not load messages.';
        empty.style.display = 'block';
      }
    }

    function renderRelationStatus(isFollowing, hasLiked) {
      const followEl = document.getElementById('followStatus');
      const likeEl = document.getElementById('likeStatus');
      const name = currentModelDisplayName || 'her';

      if (isFollowing) {
        followEl.textContent = `You are following ${name}`;
        followEl.classList.add('active');
      } else {
        followEl.textContent = 'Follow her to get more';
        followEl.classList.remove('active');
      }

      if (hasLiked) {
        likeEl.textContent = modelLikesViewer ? `You Like ${name} 💕💕` : `You Like ${name}`;
        likeEl.classList.add('active');
      } else {
        likeEl.textContent = 'Like her to get more';
        likeEl.classList.remove('active');
      }
    }

    async function toggleAction(action, btn, activeLabel, inactiveLabel) {
      if (!subscriberSession) {
        messageBox.className = 'error';
        messageBox.innerHTML = 'Log in as a subscriber first to do that. <a href="/subscriber-login.html" style="color:inherit; text-decoration:underline; font-weight:600;">Log in</a>';
        return;
      }
      try {
        const res = await fetch(`/api/models/${encodeURIComponent(currentModelUsername)}/${action}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${subscriberSession.token}` },
        });
        const data = await res.json();
        if (!res.ok) {
          messageBox.className = 'error';
          messageBox.textContent = data.message || data.error || 'Something went wrong.';
          return;
        }
        messageBox.className = '';
        messageBox.textContent = '';

        if (action === 'follow') {
          btn.textContent = data.following ? activeLabel : inactiveLabel;
          btn.classList.toggle('active', data.following);
          renderRelationStatus(data.following, document.getElementById('likeBtn').classList.contains('active'));
        } else {
          btn.textContent = data.liked ? activeLabel : inactiveLabel;
          btn.classList.toggle('active', data.liked);
          renderRelationStatus(document.getElementById('followBtn').classList.contains('active'), data.liked);
        }
      } catch (err) {
        messageBox.className = 'error';
        messageBox.textContent = 'Could not reach the server.';
      }
    }

    document.getElementById('followBtn').addEventListener('click', () => {
      toggleAction('follow', document.getElementById('followBtn'), 'Following', 'Follow');
    });
    document.getElementById('likeBtn').addEventListener('click', () => {
      toggleAction('like', document.getElementById('likeBtn'), 'Liked', 'Like');
    });
    document.getElementById('subscribeBtn').addEventListener('click', async () => {
      if (!subscriberSession) {
        messageBox.className = 'error';
        messageBox.innerHTML = 'Log in as a subscriber first to subscribe. <a href="/subscriber-login.html" style="color:inherit; text-decoration:underline; font-weight:600;">Log in</a>';
        return;
      }

      const subscribeBtn = document.getElementById('subscribeBtn');
      subscribeBtn.disabled = true;
      const originalLabel = subscribeBtn.textContent;
      subscribeBtn.textContent = 'Starting checkout...';
      messageBox.className = '';
      messageBox.textContent = '';

      try {
        const res = await fetch('/api/checkout/start', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${subscriberSession.token}`,
          },
          body: JSON.stringify({ model_id: currentModelId }),
        });
        const data = await res.json();

        if (!res.ok) {
          messageBox.className = 'error';
          messageBox.textContent = data.message || data.error || 'Could not start checkout.';
          subscribeBtn.disabled = false;
          subscribeBtn.textContent = originalLabel;
          return;
        }

        // Paystack hosts the actual payment page — send her there to
        // enter card details, rather than trying to collect them here.
        window.location.href = data.authorization_url;
      } catch (err) {
        messageBox.className = 'error';
        messageBox.textContent = 'Could not reach the server.';
        subscribeBtn.disabled = false;
        subscribeBtn.textContent = originalLabel;
      }
    });

    const viewerOverlay = document.getElementById('viewerOverlay');
    const viewerImg = document.getElementById('viewerImg');
    const viewerCounter = document.getElementById('viewerCounter');

    function openViewer(index) {
      if (allPhotos.length === 0) return;
      currentPhotoIndex = index;
      renderViewer();
      viewerOverlay.classList.add('open');
    }
    function renderViewer() {
      viewerImg.src = allPhotos[currentPhotoIndex];
      viewerCounter.textContent = `${currentPhotoIndex + 1} / ${allPhotos.length}`;
    }
    function closeViewer() {
      viewerOverlay.classList.remove('open');
    }

    document.getElementById('teaserImg').addEventListener('click', () => openViewer(0));
    document.getElementById('viewerClose').addEventListener('click', closeViewer);
    document.getElementById('viewerPrev').addEventListener('click', () => {
      currentPhotoIndex = (currentPhotoIndex - 1 + allPhotos.length) % allPhotos.length;
      renderViewer();
    });
    document.getElementById('viewerNext').addEventListener('click', () => {
      currentPhotoIndex = (currentPhotoIndex + 1) % allPhotos.length;
      renderViewer();
    });
    viewerOverlay.addEventListener('click', (e) => {
      if (e.target === viewerOverlay) closeViewer();
    });

    // ============ Story upload flow, entirely in-page ============
    const storyUploadInput = document.getElementById('storyUploadInput');
    const uploadPanel = document.getElementById('uploadPanel');
    const uploadPreview = document.getElementById('uploadPreview');
    const uploadCaption = document.getElementById('uploadCaption');
    const uploadPostBtn = document.getElementById('uploadPostBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    let selectedStoryFile = null;

    function openStoryPicker() {
      // A direct tap — a genuine user gesture, so the native picker
      // opens reliably (unlike triggering it from page load).
      storyUploadInput.click();
    }
    document.getElementById('updateNavItem').addEventListener('click', openStoryPicker);
    document.getElementById('avatarPlus').addEventListener('click', openStoryPicker);

    storyUploadInput.addEventListener('change', () => {
      const file = storyUploadInput.files[0];
      if (!file) return;
      selectedStoryFile = file;

      const url = URL.createObjectURL(file);
      uploadPreview.innerHTML = file.type.startsWith('video')
        ? `<video src="${url}" muted playsinline controls></video>`
        : `<img src="${url}" alt="">`;

      uploadStatus.textContent = '';
      uploadStatus.className = 'upload-status';
      uploadPanel.style.display = 'flex';
    });

    document.getElementById('closeUpload').addEventListener('click', () => {
      uploadPanel.style.display = 'none';
    });

    uploadPostBtn.addEventListener('click', async () => {
      if (!selectedStoryFile) {
        uploadStatus.className = 'upload-status error';
        uploadStatus.textContent = 'Choose a photo or video first.';
        return;
      }
      if (!modelSession) {
        uploadStatus.className = 'upload-status error';
        uploadStatus.textContent = 'You need to be logged in as a model to post.';
        return;
      }

      uploadPostBtn.disabled = true;
      uploadPostBtn.textContent = 'Posting...';
      uploadStatus.textContent = '';
      uploadStatus.className = 'upload-status';

      const formData = new FormData();
      formData.append('media', selectedStoryFile);
      const caption = uploadCaption.value.trim();
      if (caption) formData.append('caption', caption);

      try {
        const res = await fetch('/api/models/stories/post', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${modelSession.token}` },
          body: formData,
        });
        const data = await res.json();

        if (!res.ok) {
          uploadStatus.className = 'upload-status error';
          uploadStatus.textContent = data.message || data.error || 'Something went wrong.';
          return;
        }

        uploadStatus.className = 'upload-status success';
        uploadStatus.textContent = 'Story posted!';
        selectedStoryFile = null;
        uploadCaption.value = '';
        storyUploadInput.value = '';

        setTimeout(() => {
          uploadPanel.style.display = 'none';
        }, 900);
      } catch (err) {
        uploadStatus.className = 'upload-status error';
        uploadStatus.textContent = 'Could not reach the server.';
      } finally {
        uploadPostBtn.disabled = false;
        uploadPostBtn.textContent = 'Post Story';
      }
    });

    if (username) {
      loadProfile();
    }
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
