<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Your Photo</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 32px;
    margin: 0;
  }
  nav { display: flex; justify-content: center; padding: 20px; max-width: 420px; width: 100%; }
  nav img { height: 32px; width: auto; }
  .card { max-width: 380px; width: 100%; text-align: center; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p.sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
  #whoami { color: var(--accent-gold); font-size: 13px; margin-bottom: 24px; }

  .avatar-drop {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--bg-surface);
    border: 1.5px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    margin: 0 auto 24px;
    color: var(--text-secondary);
    font-size: 13px;
    text-align: center;
    padding: 10px;
  }
  .avatar-drop img { width: 100%; height: 100%; object-fit: cover; }
  input[type="file"] { display: none; }

  #uploadBtn {
    width: auto;
    display: inline-block;
    min-width: 160px;
    margin: 0 auto;
    background: var(--accent-gold);
    color: var(--border-subtle);
    font-weight: 600;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    cursor: pointer;
  }
  #uploadBtn:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }

  #message {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
    line-height: 1.5;
  }
  #message.success { background: var(--success-bg); color: var(--accent-green); display: block; }
  #message.error { background: var(--danger-bg); color: var(--danger); display: block; }
  a { color: var(--accent-gold); }
</style>
</head>
<body>
  <nav>
    <a href="/index.html"><img src="/logo.png" alt="Xerelle"></a>
  </nav>
  <button onclick="xerelleGoBack()" style="position:fixed; top:16px; left:16px; z-index:20; background:var(--bg-surface); border:1px solid var(--border); border-radius:50%; color:var(--text-primary); cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="card">
    <h1>Your photo</h1>
    <p class="sub">Add a photo so models know it's really you.</p>
    <div id="whoami"></div>

    <div id="uploadArea">
      <div class="avatar-drop" id="avatarDrop">Tap to choose a photo</div>
      <input type="file" id="photoInput" accept="image/*">
      <button id="uploadBtn">Save photo</button>
    </div>

    <div id="message"></div>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem('xerelle_subscriber_session') || 'null');
    const whoami = document.getElementById('whoami');
    const uploadArea = document.getElementById('uploadArea');
    const avatarDrop = document.getElementById('avatarDrop');
    const photoInput = document.getElementById('photoInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const messageBox = document.getElementById('message');

    if (!session) {
      whoami.innerHTML = 'You need to <a href="/subscriber-login.html">log in</a> first.';
      uploadArea.style.display = 'none';
    } else {
      whoami.textContent = `${session.display_name} (@${session.username})`;
    }

    avatarDrop.addEventListener('click', () => photoInput.click());

    photoInput.addEventListener('change', () => {
      if (!photoInput.files.length) return;
      const url = URL.createObjectURL(photoInput.files[0]);
      avatarDrop.innerHTML = `<img src="${url}" alt="">`;
    });

    uploadBtn.addEventListener('click', async () => {
      if (!photoInput.files.length) {
        messageBox.className = 'error';
        messageBox.textContent = 'Choose a photo first.';
        return;
      }

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Saving...';
      messageBox.className = '';
      messageBox.textContent = '';

      const formData = new FormData();
      formData.append('photo', photoInput.files[0]);

      try {
        const res = await fetch('/api/subscribers/avatar/upload', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${session.token}` },
          body: formData,
        });
        const data = await res.json();

        if (!res.ok) {
          messageBox.className = 'error';
          messageBox.textContent = data.message || data.error || 'Upload failed.';
          return;
        }

        messageBox.className = 'success';
        messageBox.textContent = 'Photo saved!';

        // Update the cached session so the new photo shows immediately
        // elsewhere (like the Profile tab) without needing to log out and back in.
        if (session && data.avatar_url) {
          session.avatar_url = data.avatar_url;
          localStorage.setItem('xerelle_subscriber_session', JSON.stringify(session));
        }
      } catch (err) {
        messageBox.className = 'error';
        messageBox.textContent = 'Could not reach the server.';
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Save photo';
      }
    });
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
