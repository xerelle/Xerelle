<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Sign Up</title>
<style>
  nav { display: flex; justify-content: center; padding: 20px; max-width: 420px; margin: 0 auto; }
  nav img { height: 32px; width: auto; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 40px;
    margin: 0;
    position: relative;
  }
  .card { max-width: 420px; width: 100%; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p.sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 28px; }
  label {
    display: block; font-size: 13px; color: var(--text-tertiary);
    margin-bottom: 6px; margin-top: 16px;
  }
  label .optional { color: var(--text-secondary); font-weight: 400; text-transform: none; letter-spacing: 0; }
  input {
    width: 100%; box-sizing: border-box;
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; color: var(--text-primary); font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--accent-gold); }
  .model-field-hint {
    font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5;
  }
  #submitBtn {
    width: 100%; margin-top: 26px;
    background: var(--accent-gold); color: var(--border-subtle); font-weight: 600;
    padding: 14px; border-radius: 10px; border: none;
    font-size: 15px; cursor: pointer;
  }
  #submitBtn:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }
  #message {
    margin-top: 18px; padding: 12px 14px; border-radius: 8px;
    font-size: 14px; display: none; line-height: 1.5;
  }
  #message.success { background: var(--success-bg); color: var(--accent-green); display: block; }
  #message.error { background: var(--danger-bg); color: var(--danger); display: block; }
  a { color: var(--accent-green); }
</style>
</head>
<body>
  <nav>
    <a href="/index.html"><img src="/logo.png" alt="Xerelle"></a>
  </nav>
  <div class="card">
    <button onclick="xerelleGoBack()" style="position:fixed; top:16px; left:16px; z-index:20; background:var(--bg-surface); border:1px solid var(--border); border-radius:50%; color:var(--text-primary); cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>Create your account</h1>
    <p class="sub">Free to join — you'll still need a model's exact link or username to actually enter her Room.</p>

    <form id="registerForm">
      <label for="username">Choose a username</label>
      <input type="text" id="username" required placeholder="Your own username" pattern="[a-z0-9._-]{3,30}">

      <label for="display_name">Name</label>
      <input type="text" id="display_name" required placeholder="Your name">

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" required placeholder="+2348012345678">

      <label for="email">Email (optional)</label>
      <input type="email" id="email" placeholder="you@example.com">

      <label for="password">Password</label>
      <input type="password" id="password" required minlength="8">

      <label for="model_username">Who did you come for? <span class="optional">(optional)</span></label>
      <input type="text" id="model_username" placeholder="Her exact username">
      <div class="model-field-hint">If you know the username of the model you're here for, enter it and we'll take you straight to her Room after signup.</div>

      <button type="submit" id="submitBtn">Create account</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const messageBox = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    // If arriving from a specific model's Room (e.g. room.html links here
    // with ?model=hername when she isn't logged in yet), pre-fill the
    // field so he doesn't have to retype what he already found.
    const prefillModel = new URLSearchParams(window.location.search).get('model');
    if (prefillModel) {
      document.getElementById('model_username').value = prefillModel;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';
      messageBox.className = '';
      messageBox.textContent = '';

      const modelUsername = document.getElementById('model_username').value.trim();

      const body = {
        username: document.getElementById('username').value.trim(),
        display_name: document.getElementById('display_name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim() || undefined,
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch('/api/subscribers/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (!res.ok) {
          messageBox.className = 'error';
          messageBox.textContent = data.error || 'Something went wrong. Please try again.';
        } else {
          localStorage.setItem('xerelle_subscriber_session', JSON.stringify(data));
          messageBox.className = 'success';

          const destination = modelUsername
            ? `/room.html?u=${encodeURIComponent(modelUsername)}`
            : '/subscriber-avatar.html';

          messageBox.textContent = modelUsername
            ? `Welcome, @${data.username}! Taking you to her Room...`
            : `Welcome, @${data.username}! Redirecting...`;

          form.reset();
          setTimeout(() => { window.location.href = destination; }, 1200);
        }
      } catch (err) {
        messageBox.className = 'error';
        messageBox.textContent = 'Could not reach the server. Please check your connection and try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
