<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Sign Up</title>
<style>
  nav { display: flex; justify-content: center; padding: 20px; max-width: 420px; margin: 0 auto; }
  nav img { height: 32px; width: auto; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 40px;
    margin: 0;
    position: relative;
  }
  .card { max-width: 420px; width: 100%; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p.sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 28px; }
  label {
    display: block; font-size: 13px; color: var(--text-tertiary);
    margin-bottom: 6px; margin-top: 16px;
  }
  input {
    width: 100%; box-sizing: border-box;
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; color: var(--text-primary); font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--accent-gold); }
  button {
    width: 100%; margin-top: 26px;
    background: var(--accent-gold); color: var(--border-subtle); font-weight: 600;
    padding: 14px; border-radius: 10px; border: none;
    font-size: 15px; cursor: pointer;
  }
  button:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }
  #message {
    margin-top: 18px; padding: 12px 14px; border-radius: 8px;
    font-size: 14px; display: none; line-height: 1.5;
  }
  #message.success { background: var(--success-bg); color: var(--accent-green); display: block; }
  #message.error { background: var(--danger-bg); color: var(--danger); display: block; }
  a { color: var(--accent-green); }
</style>
</head>
<body>
  <nav>
    <a href="/index.html"><img src="/logo.png" alt="Xerelle"></a>
  </nav>
  <div class="card">
    <button onclick="xerelleGoBack()" style="position:fixed; top:16px; left:16px; z-index:20; background:none; border:none; color:var(--text-primary); cursor:pointer; padding:8px; display:flex;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:22px; height:22px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <h1>Create your account</h1>
    <p class="sub">Free to join — you'll still need a model's exact link or username to actually enter her Room.</p>

    <form id="registerForm">
      <label for="username">Username</label>
      <input type="text" id="username" required placeholder="Username" pattern="[a-z0-9._-]{3,30}">

      <label for="display_name">Name</label>
      <input type="text" id="display_name" required placeholder="Your name">

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" required placeholder="+2348012345678">

      <label for="email">Email (optional)</label>
      <input type="email" id="email" placeholder="you@example.com">

      <label for="password">Password</label>
      <input type="password" id="password" required minlength="8">

      <button type="submit" id="submitBtn">Create account</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const messageBox = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';
      messageBox.className = '';
      messageBox.textContent = '';

      const body = {
        username: document.getElementById('username').value.trim(),
        display_name: document.getElementById('display_name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim() || undefined,
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch('/api/subscribers/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (!res.ok) {
          messageBox.className = 'error';
          messageBox.textContent = data.error || 'Something went wrong. Please try again.';
        } else {
          messageBox.className = 'success';
          messageBox.innerHTML = `Account created! <a href="/subscriber-login.html">Log in</a>, then use the link a model gave you, or search her exact username, to enter her Room.`;
          form.reset();
        }
      } catch (err) {
        messageBox.className = 'error';
        messageBox.textContent = 'Could not reach the server. Please check your connection and try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
