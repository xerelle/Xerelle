<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xerelle — Sign Up</title>
<style>
  body {
    background: #0F0509;
    color: #F7F0E6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    margin: 0;
  }
  .card { max-width: 420px; width: 100%; }
  h1 { font-size: 24px; margin-bottom: 6px; }
  p.sub { color: #9C8791; font-size: 14px; margin-bottom: 28px; }
  label {
    display: block; font-size: 13px; color: #C9B8BF;
    margin-bottom: 6px; margin-top: 16px;
  }
  input {
    width: 100%; box-sizing: border-box;
    background: #3A1029; border: 1px solid #4A1E36; border-radius: 8px;
    padding: 12px 14px; color: #F7F0E6; font-size: 15px;
  }
  input:focus { outline: none; border-color: #D4A24C; }
  button {
    width: 100%; margin-top: 26px;
    background: #D4A24C; color: #2B0A1F; font-weight: 600;
    padding: 14px; border-radius: 10px; border: none;
    font-size: 15px; cursor: pointer;
  }
  button:disabled { background: #4A1E36; color: #9C8791; cursor: not-allowed; }
  #message {
    margin-top: 18px; padding: 12px 14px; border-radius: 8px;
    font-size: 14px; display: none; line-height: 1.5;
  }
  #message.success { background: rgba(27,77,62,0.2); color: #4E9C82; display: block; }
  #message.error { background: rgba(232,139,155,0.15); color: #E88B9B; display: block; }
  a { color: #4E9C82; }
</style>
</head>
<body>
  <div class="card">
    <h1>Create your account</h1>
    <p class="sub">Free to join — you'll still need a model's exact link or username to actually enter her Room.</p>

    <form id="registerForm">
      <label for="phone">Phone number</label>
      <input type="tel" id="phone" required placeholder="+2348012345678">

      <label for="email">Email (optional)</label>
      <input type="email" id="email" placeholder="you@example.com">

      <label for="password">Password</label>
      <input type="password" id="password" required minlength="8">

      <button type="submit" id="submitBtn">Create account</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const messageBox = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';
      messageBox.className = '';
      messageBox.textContent = '';

      const body = {
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim() || undefined,
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch('/api/subscribers/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (!res.ok) {
          messageBox.className = 'error';
          messageBox.textContent = data.error || 'Something went wrong. Please try again.';
        } else {
          messageBox.className = 'success';
          messageBox.innerHTML = `Account created! <a href="/subscriber-login.html">Log in</a>, then use the link a model gave you, or search her exact username, to enter her Room.`;
          form.reset();
        }
      } catch (err) {
        messageBox.className = 'error';
        messageBox.textContent = 'Could not reach the server. Please check your connection and try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
