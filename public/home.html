<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xerelle — Home</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0F0509;
    color: #F7F0E6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    margin: 0;
    min-height: 100vh;
  }
  .card {
    max-width: 460px;
    width: 100%;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid #4A1E36;
  }
  .header h1 { font-size: 20px; margin: 0; }

  /* Persistent Stories row */
  .story-row {
    display: flex;
    gap: 16px;
    padding: 16px 20px;
    overflow-x: auto;
    border-bottom: 1px solid #2B0A1F;
  }
  .story-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    width: 68px;
    cursor: pointer;
    background: none;
    border: none;
  }
  .story-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #3A1029;
    border: 3px solid #D4A24C;
    padding: 2px;
    object-fit: cover;
  }
  .story-name {
    font-size: 11px;
    color: #C9B8BF;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }
  .story-row-empty {
    padding: 16px 20px;
    color: #9C8791;
    font-size: 12.5px;
    border-bottom: 1px solid #2B0A1F;
  }

  /* Menu bar (Chats / Notifications / Profile) */
  .menu-bar {
    display: flex;
    border-bottom: 1px solid #4A1E36;
  }
  .menu-item {
    flex: 1;
    text-align: center;
    padding: 13px 0;
    background: none;
    border: none;
    color: #9C8791;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .menu-item.active {
    color: #D4A24C;
    border-bottom: 2px solid #D4A24C;
  }

  .tab-content { flex: 1; overflow-y: auto; }

  /* Chats */
  .thread-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid #2B0A1F;
    text-decoration: none;
    color: inherit;
  }
  .thread-item:active { background: #1A0710; }
  .avatar-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #3A1029;
    border: 1px solid #4A1E36;
    flex-shrink: 0;
    margin-right: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    color: #D4A24C;
    overflow: hidden;
  }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
  .thread-left { min-width: 0; flex: 1; }
  .thread-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .thread-preview {
    font-size: 13px; color: #9C8791;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thread-preview.you { color: #C9B8BF; }
  .thread-time { font-size: 11.5px; color: #9C8791; flex-shrink: 0; margin-left: 12px; }

  /* Profile */
  .profile-block { padding: 30px 20px; text-align: center; }
  .profile-avatar {
    width: 100px; height: 100px; border-radius: 50%;
    background: #3A1029; border: 2px solid #4A1E36;
    margin: 0 auto 16px; object-fit: cover; display: block;
  }
  .profile-name { font-size: 19px; margin-bottom: 2px; }
  .profile-sub { color: #9C8791; font-size: 13.5px; margin-bottom: 24px; }
  .profile-link {
    display: block; width: 100%; max-width: 280px; margin: 0 auto 12px;
    background: #3A1029; border: 1px solid #4A1E36; color: #F7F0E6;
    padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 600;
    text-decoration: none; cursor: pointer;
  }
  .profile-link.danger { border-color: #E88B9B; color: #E88B9B; }
  .profile-divider {
    max-width: 280px; margin: 20px auto; border-top: 1px solid #2B0A1F;
  }

  .placeholder-tab {
    padding: 60px 20px; text-align: center; color: #9C8791; font-size: 14px;
  }

  /* Story overlay (full screen viewer) */
  .story-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 11;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .story-overlay.open { display: flex; }
  .story-overlay img, .story-overlay video {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
  }
  .story-caption {
    position: absolute;
    bottom: 40px;
    left: 20px;
    right: 20px;
    color: #F7F0E6;
    font-size: 14px;
    text-align: center;
    background: rgba(0,0,0,0.5);
    padding: 10px 14px;
    border-radius: 8px;
  }
  .story-name-tag {
    position: absolute;
    top: 24px;
    left: 24px;
    color: #F7F0E6;
    font-size: 14px;
    font-weight: 600;
  }
  .story-close {
    position: absolute;
    top: 24px;
    right: 24px;
    background: none;
    border: none;
    color: #F7F0E6;
    font-size: 28px;
    cursor: pointer;
    z-index: 12;
  }

  #loading, #empty, #notfound {
    padding: 60px 20px; text-align: center; color: #9C8791;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header"><h1>Xerelle</h1></div>

    <!-- Persistent Stories row -->
    <div id="storiesLoading" style="padding:16px 20px; color:#9C8791; font-size:12.5px;">Loading updates...</div>
    <div class="story-row-empty" id="storiesEmpty" style="display:none;">No updates right now. Follow a model to see her Stories here.</div>
    <div class="story-row" id="storyRow" style="display:none;"></div>

    <div class="menu-bar">
      <button class="menu-item active" id="menuChats" data-tab="chats">Chats</button>
      <button class="menu-item" id="menuNotifications" data-tab="notifications">Notifications</button>
      <button class="menu-item" id="menuProfile" data-tab="profile">Profile</button>
    </div>

    <div class="tab-content">
      <div id="chatsTab">
        <div id="loading">Loading...</div>
        <div id="notfound" style="display:none;"></div>
        <div id="empty" style="display:none;">No conversations yet. Message a model from her Room to start one.</div>
        <div id="threadList"></div>
      </div>

      <div id="notificationsTab" class="placeholder-tab" style="display:none;">
        No notifications yet.
      </div>

      <div id="profileTab" style="display:none;">
        <div class="profile-block">
          <img class="profile-avatar" id="profileAvatarImg" src="" alt="" style="display:none;">
          <div class="profile-avatar" id="profileAvatarInitial" style="display:none; align-items:center; justify-content:center; font-size:34px; color:#D4A24C; font-weight:600;"></div>
          <div class="profile-name" id="profileName"></div>
          <div class="profile-sub" id="profilePhone"></div>
          <a class="profile-link" href="/subscriber-avatar.html">Change photo</a>
          <div class="profile-divider"></div>
          <a class="profile-link" href="#" onclick="alert('Settings — coming soon'); return false;">Settings</a>
          <a class="profile-link" href="#" onclick="alert('Payment methods — coming soon'); return false;">Payment methods</a>
          <div class="profile-divider"></div>
          <a class="profile-link danger" href="#" id="logoutBtn">Log out</a>
        </div>
      </div>
    </div>
  </div>

  <div class="story-overlay" id="storyOverlay">
    <button class="story-close" id="storyClose">&times;</button>
    <div class="story-name-tag" id="storyNameTag"></div>
    <div id="storyMediaContainer"></div>
    <div class="story-caption" id="storyCaption" style="display:none;"></div>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem('xerelle_subscriber_session') || 'null');

    const tabs = {
      chats: { el: document.getElementById('chatsTab'), nav: document.getElementById('menuChats') },
      notifications: { el: document.getElementById('notificationsTab'), nav: document.getElementById('menuNotifications') },
      profile: { el: document.getElementById('profileTab'), nav: document.getElementById('menuProfile') },
    };

    function switchTab(name) {
      Object.entries(tabs).forEach(([key, tab]) => {
        tab.el.style.display = key === name ? 'block' : 'none';
        tab.nav.classList.toggle('active', key === name);
      });
      if (name === 'profile') loadProfile();
    }

    Object.entries(tabs).forEach(([key, tab]) => {
      tab.nav.addEventListener('click', () => switchTab(key));
    });

    function formatTime(unixSeconds) {
      const date = new Date(unixSeconds * 1000);
      const now = new Date();
      const isToday = date.toDateString() === now.toDateString();
      if (isToday) return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    async function loadMessages() {
      const loading = document.getElementById('loading');
      const notfound = document.getElementById('notfound');
      const empty = document.getElementById('empty');
      const threadList = document.getElementById('threadList');

      if (!session) {
        loading.style.display = 'none';
        notfound.textContent = 'Log in first.';
        notfound.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/subscribers/inbox', {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        const data = await res.json();

        if (!res.ok) {
          loading.style.display = 'none';
          notfound.textContent = data.message || data.error || 'Something went wrong.';
          notfound.style.display = 'block';
          return;
        }

        loading.style.display = 'none';

        if (!data.threads || data.threads.length === 0) {
          empty.style.display = 'block';
          return;
        }

        data.threads.forEach((thread) => {
          const item = document.createElement('a');
          item.className = 'thread-item';
          item.href = `/chat.html?u=${encodeURIComponent(thread.model_username)}`;

          const prefix = thread.last_sender_type === 'subscriber' ? 'You: ' : '';
          const initial = thread.model_display_name.trim().charAt(0).toUpperCase();
          const avatarContent = thread.teaser_media_url
            ? `<img src="${thread.teaser_media_url}" alt="">`
            : initial;

          item.innerHTML = `
            <div class="avatar-circle">${avatarContent}</div>
            <div class="thread-left">
              <div class="thread-name">${thread.model_display_name}</div>
              <div class="thread-preview">${prefix}${thread.last_message}</div>
            </div>
            <div class="thread-time">${formatTime(thread.last_sent_at)}</div>
          `;
          threadList.appendChild(item);
        });
      } catch (err) {
        loading.style.display = 'none';
        notfound.textContent = 'Could not reach the server.';
        notfound.style.display = 'block';
      }
    }

    // Stories row now loads immediately on page load (persistent, not a tab)
    async function loadStories() {
      const loading = document.getElementById('storiesLoading');
      const empty = document.getElementById('storiesEmpty');
      const storyRow = document.getElementById('storyRow');

      if (!session) {
        loading.style.display = 'none';
        return;
      }

      try {
        const res = await fetch('/api/subscribers/stories-feed', {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        const data = await res.json();

        loading.style.display = 'none';

        if (!data.stories || data.stories.length === 0) {
          empty.style.display = 'block';
          return;
        }

        storyRow.style.display = 'flex';
        data.stories.forEach((story) => {
          const item = document.createElement('button');
          item.className = 'story-item';
          const initial = story.model_display_name.trim().charAt(0).toUpperCase();
          item.innerHTML = `
            <img class="story-avatar" src="${story.teaser_media_url || ''}" onerror="this.style.display='none'" alt="">
            <div class="story-name">${story.model_display_name}</div>
          `;
          item.addEventListener('click', () => openStory(story));
          storyRow.appendChild(item);
        });
      } catch (err) {
        loading.style.display = 'none';
        empty.textContent = 'Could not load updates.';
        empty.style.display = 'block';
      }
    }

    const storyOverlay = document.getElementById('storyOverlay');
    const storyMediaContainer = document.getElementById('storyMediaContainer');
    const storyCaption = document.getElementById('storyCaption');
    const storyNameTag = document.getElementById('storyNameTag');

    function openStory(story) {
      storyNameTag.textContent = story.model_display_name;
      storyMediaContainer.innerHTML = story.media_type === 'video'
        ? `<video src="${story.media_url}" autoplay controls></video>`
        : `<img src="${story.media_url}" alt="">`;

      if (story.caption) {
        storyCaption.textContent = story.caption;
        storyCaption.style.display = 'block';
      } else {
        storyCaption.style.display = 'none';
      }

      storyOverlay.classList.add('open');
    }
    function closeStory() {
      storyOverlay.classList.remove('open');
      storyMediaContainer.innerHTML = '';
    }
    document.getElementById('storyClose').addEventListener('click', closeStory);
    storyOverlay.addEventListener('click', (e) => {
      if (e.target === storyOverlay) closeStory();
    });

    function loadProfile() {
      if (!session) return;
      document.getElementById('profileName').textContent = session.display_name || 'You';
      document.getElementById('profilePhone').textContent = session.phone ? `@${session.username || ''} · ${session.phone}` : '';

      const avatarImg = document.getElementById('profileAvatarImg');
      const avatarInitial = document.getElementById('profileAvatarInitial');
      if (session.avatar_url) {
        avatarImg.src = session.avatar_url;
        avatarImg.style.display = 'block';
      } else {
        avatarInitial.textContent = (session.display_name || '?').trim().charAt(0).toUpperCase();
        avatarInitial.style.display = 'flex';
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('xerelle_subscriber_session');
      window.location.href = '/subscriber-login.html';
    });

    loadMessages();
    loadStories();
  </script>
</body>
</html>
