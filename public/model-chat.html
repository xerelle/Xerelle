<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 0;
    margin: 0;
    height: 100vh;
    overflow: hidden;
  }
  .card { max-width: 460px; width: 100%; height: 100vh; display: flex; flex-direction: column; }
  .header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-primary);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent-gold);
    overflow: hidden;
  }
  .avatar-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .header h1 { font-size: 17px; margin: 0; }
  .header .sub { color: var(--text-secondary); font-size: 12.5px; margin-top: 2px; }
  .streak-badge { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; font-size: 12.5px; font-weight: 600; vertical-align: middle; }
  .streak-badge svg { flex-shrink: 0; }
  .header-menu-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
  }
  .header-dropdown {
    display: none;
    position: absolute;
    top: 56px;
    right: 20px;
    z-index: 5;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    z-index: 3;
  }
  .header-dropdown.open { display: block; }
  .header-dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 18px;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .header-dropdown button.danger { color: var(--danger); }
  .header-dropdown button:active { background: var(--border); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 10;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--bg-surface-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    max-width: 380px;
    width: 100%;
  }
  .modal-box h2 { font-size: 16px; margin: 0 0 8px; }
  .modal-box p { font-size: 13px; color: var(--text-secondary); margin: 0 0 14px; line-height: 1.5; }
  .modal-box textarea {
    width: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 70px;
  }
  .modal-box textarea:focus { outline: none; border-color: var(--accent-gold); }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .modal-actions button {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal-actions .cancel-btn { background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border); }
  .modal-actions .confirm-btn { background: var(--danger); color: var(--border-subtle); }
  .modal-actions .confirm-btn:disabled { background: var(--border); color: var(--text-secondary); }

  .thread {
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    overflow-y: auto;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.4;
  }
  .bubble.model {
    align-self: flex-end;
    background: var(--accent-gold);
    color: var(--border-subtle);
    border-bottom-right-radius: 4px;
  }
  .bubble.subscriber {
    align-self: flex-start;
    background: var(--bg-surface);
    color: var(--text-primary);
    border-bottom-left-radius: 4px;
  }
  .empty-state {
    color: var(--text-secondary);
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
    padding: 0 20px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 14px 20px 24px;
    border-top: 1px solid var(--border);
    background: var(--bg-primary);
    flex-shrink: 0;
  }
  .input-row input {
    flex: 1;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px 16px;
    color: var(--text-primary);
    font-size: 14.5px;
  }
  .input-row input:focus { outline: none; border-color: var(--accent-gold); }
  .input-row button {
    background: var(--accent-gold);
    color: var(--border-subtle);
    font-weight: 600;
    padding: 0 20px;
    border-radius: 20px;
    border: none;
    font-size: 14.5px;
    cursor: pointer;
  }
  .input-row button:disabled {
    background: var(--border);
    color: var(--text-secondary);
    cursor: not-allowed;
  }

  #loading, #notfound {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-secondary);
  }
  a.plain { color: var(--accent-gold); }
</style>
</head>
<body>
  <div class="card">
    <div id="loading">Loading...</div>
    <div id="notfound" style="display:none;"></div>

    <div id="chatUI" style="display:none; flex-direction:column; height:100%;">
      <div class="header">
        <div class="avatar-circle" id="avatarCircle"></div>
        <div>
          <h1><span id="subscriberNameText"></span><span id="streakBadge"></span></h1>
          <div class="sub">Private between you and this subscriber.</div>
        </div>
        <button class="header-menu-btn" id="headerMenuBtn">⋮</button>
      </div>
      <div class="header-dropdown" id="headerDropdown">
        <button id="blockOptionBtn">Block subscriber</button>
        <button class="danger" id="reportOptionBtn">Report subscriber</button>
      </div>

      <div class="thread" id="thread">
        <div class="empty-state" id="emptyState">No messages in this thread yet.</div>
      </div>

      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Type a reply..." maxlength="1000">
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
      <textarea id="modalReason" placeholder="Reason (required)..."></textarea>
      <div class="modal-actions">
        <button class="cancel-btn" id="modalCancelBtn">Cancel</button>
        <button class="confirm-btn" id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const subscriberId = new URLSearchParams(window.location.search).get('subscriber');
    const subscriberName = new URLSearchParams(window.location.search).get('name') || 'Subscriber';
    const subscriberAvatar = new URLSearchParams(window.location.search).get('avatar') || '';
    const session = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');

    const loading = document.getElementById('loading');
    const notfound = document.getElementById('notfound');
    const chatUI = document.getElementById('chatUI');
    const thread = document.getElementById('thread');
    const emptyState = document.getElementById('emptyState');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    function showNotFound(message) {
      loading.style.display = 'none';
      notfound.textContent = message;
      notfound.style.display = 'block';
    }

    function renderMessage(msg) {
      const bubble = document.createElement('div');
      bubble.className = `bubble ${msg.sender_type}`;
      bubble.textContent = msg.body;
      thread.appendChild(bubble);
    }

    async function init() {
      if (!session) {
        window.location.href = '/login.html';
        return;
      }
      if (!subscriberId) {
        showNotFound('No conversation specified.');
        return;
      }

      document.getElementById('subscriberNameText').textContent = subscriberName;
      const avatarCircle = document.getElementById('avatarCircle');
      avatarCircle.innerHTML = subscriberAvatar
        ? `<img src="${window.xerelleEscapeHtml(subscriberAvatar)}" alt="">`
        : subscriberName.trim().charAt(0).toUpperCase();

      try {
        const res = await fetch(`/api/messages/${subscriberId}/${session.id}`, {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        if (res.ok) {
          const data = await res.json();
          if (data.messages && data.messages.length > 0) {
            emptyState.style.display = 'none';
            data.messages.forEach(renderMessage);
          }
          document.getElementById('streakBadge').innerHTML = window.renderStreakBadge(data.streak || 0);
        }
        loading.style.display = 'none';
        chatUI.style.display = 'flex';
      } catch (err) {
        showNotFound('Could not reach the server.');
      }
    }

    async function sendMessage() {
      const body = messageInput.value.trim();
      if (!body) return;

      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/messages/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sender_type: 'model',
            subscriber_id: subscriberId,
            model_id: session.id,
            message_body: body,
          }),
        });

        if (!res.ok) {
          const data = await res.json();
          alert(data.error || 'Something went wrong.');
          return;
        }

        emptyState.style.display = 'none';
        renderMessage({ sender_type: 'model', body });
        messageInput.value = '';
      } catch (err) {
        alert('Could not reach the server.');
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Header menu (Block / Report)
    const headerMenuBtn = document.getElementById('headerMenuBtn');
    const headerDropdown = document.getElementById('headerDropdown');
    headerMenuBtn.addEventListener('click', () => {
      headerDropdown.classList.toggle('open');
    });

    let pendingAction = null; // 'block' or 'report'

    function openModal(action) {
      pendingAction = action;
      headerDropdown.classList.remove('open');
      document.getElementById('modalTitle').textContent =
        action === 'block' ? 'Block this subscriber?' : 'Report this subscriber';
      document.getElementById('modalDesc').textContent =
        action === 'block'
          ? "She won't be able to message you again, and you won't be able to message her. This requires a reason."
          : "Let us know what's going on. Our team will review it.";
      document.getElementById('modalReason').value = '';
      document.getElementById('modalOverlay').classList.add('open');
    }

    document.getElementById('blockOptionBtn').addEventListener('click', () => openModal('block'));
    document.getElementById('reportOptionBtn').addEventListener('click', () => openModal('report'));

    document.getElementById('modalCancelBtn').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.remove('open');
    });

    document.getElementById('modalConfirmBtn').addEventListener('click', async () => {
      const reason = document.getElementById('modalReason').value.trim();
      if (!reason) {
        alert('A reason is required.');
        return;
      }

      const confirmBtn = document.getElementById('modalConfirmBtn');
      confirmBtn.disabled = true;

      try {
        const endpoint = pendingAction === 'block' ? '/api/block' : '/api/report';
        const payload = pendingAction === 'block'
          ? { blocked_type: 'subscriber', blocked_id: subscriberId, reason }
          : { reported_type: 'subscriber', reported_id: subscriberId, reason };

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.token}`,
          },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          alert(data.error || data.message || 'Something went wrong.');
          return;
        }

        document.getElementById('modalOverlay').classList.remove('open');

        if (pendingAction === 'block') {
          alert('Subscriber blocked.');
          window.location.href = '/inbox.html';
        } else {
          alert(data.message || 'Report submitted.');
        }
      } catch (err) {
        alert('Could not reach the server.');
      } finally {
        confirmBtn.disabled = false;
      }
    });

    init();
  </script>
  <script src="/js/streak-icons.js"></script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
