<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xerelle — Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #0F0509;
    color: #F7F0E6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 0;
    margin: 0;
    min-height: 100vh;
  }
  .card { max-width: 460px; width: 100%; }
  .header {
    padding: 16px 20px;
    border-bottom: 1px solid #4A1E36;
    position: sticky;
    top: 0;
    background: #0F0509;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #3A1029;
    border: 1px solid #4A1E36;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 600;
    color: #D4A24C;
    overflow: hidden;
  }
  .avatar-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .header h1 { font-size: 17px; margin: 0; }
  .header .sub { color: #9C8791; font-size: 12.5px; margin-top: 2px; }

  .thread {
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 40vh;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.4;
  }
  .bubble.model {
    align-self: flex-end;
    background: #D4A24C;
    color: #2B0A1F;
    border-bottom-right-radius: 4px;
  }
  .bubble.subscriber {
    align-self: flex-start;
    background: #3A1029;
    color: #F7F0E6;
    border-bottom-left-radius: 4px;
  }
  .empty-state {
    color: #9C8791;
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
    padding: 0 20px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 14px 20px 24px;
    border-top: 1px solid #4A1E36;
    position: sticky;
    bottom: 0;
    background: #0F0509;
  }
  .input-row input {
    flex: 1;
    background: #3A1029;
    border: 1px solid #4A1E36;
    border-radius: 20px;
    padding: 12px 16px;
    color: #F7F0E6;
    font-size: 14.5px;
  }
  .input-row input:focus { outline: none; border-color: #D4A24C; }
  .input-row button {
    background: #D4A24C;
    color: #2B0A1F;
    font-weight: 600;
    padding: 0 20px;
    border-radius: 20px;
    border: none;
    font-size: 14.5px;
    cursor: pointer;
  }
  .input-row button:disabled {
    background: #4A1E36;
    color: #9C8791;
    cursor: not-allowed;
  }

  #loading, #notfound {
    padding: 60px 20px;
    text-align: center;
    color: #9C8791;
  }
  a.plain { color: #D4A24C; }
</style>
</head>
<body>
  <div class="card">
    <div id="loading">Loading...</div>
    <div id="notfound" style="display:none;"></div>

    <div id="chatUI" style="display:none;">
      <div class="header">
        <div class="avatar-circle" id="avatarCircle"></div>
        <div>
          <h1 id="subscriberName"></h1>
          <div class="sub">Private between you and this subscriber.</div>
        </div>
      </div>

      <div class="thread" id="thread">
        <div class="empty-state" id="emptyState">No messages in this thread yet.</div>
      </div>

      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Type a reply..." maxlength="1000">
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script>
    const subscriberId = new URLSearchParams(window.location.search).get('subscriber');
    const subscriberName = new URLSearchParams(window.location.search).get('name') || 'Subscriber';
    const subscriberAvatar = new URLSearchParams(window.location.search).get('avatar') || '';
    const session = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');

    const loading = document.getElementById('loading');
    const notfound = document.getElementById('notfound');
    const chatUI = document.getElementById('chatUI');
    const thread = document.getElementById('thread');
    const emptyState = document.getElementById('emptyState');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    function showNotFound(message) {
      loading.style.display = 'none';
      notfound.textContent = message;
      notfound.style.display = 'block';
    }

    function renderMessage(msg) {
      const bubble = document.createElement('div');
      bubble.className = `bubble ${msg.sender_type}`;
      bubble.textContent = msg.body;
      thread.appendChild(bubble);
    }

    async function init() {
      if (!subscriberId) {
        showNotFound('No conversation specified.');
        return;
      }
      if (!session) {
        showNotFound('Log in first.');
        return;
      }

      document.getElementById('subscriberName').textContent = subscriberName;
      const avatarCircle = document.getElementById('avatarCircle');
      avatarCircle.innerHTML = subscriberAvatar
        ? `<img src="${subscriberAvatar}" alt="">`
        : subscriberName.trim().charAt(0).toUpperCase();

      try {
        const res = await fetch(`/api/messages/${subscriberId}/${session.id}`, {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        if (res.ok) {
          const data = await res.json();
          if (data.messages && data.messages.length > 0) {
            emptyState.style.display = 'none';
            data.messages.forEach(renderMessage);
          }
        }
        loading.style.display = 'none';
        chatUI.style.display = 'block';
      } catch (err) {
        showNotFound('Could not reach the server.');
      }
    }

    async function sendMessage() {
      const body = messageInput.value.trim();
      if (!body) return;

      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/messages/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sender_type: 'model',
            subscriber_id: subscriberId,
            model_id: session.id,
            message_body: body,
          }),
        });

        if (!res.ok) {
          const data = await res.json();
          alert(data.error || 'Something went wrong.');
          return;
        }

        emptyState.style.display = 'none';
        renderMessage({ sender_type: 'model', body });
        messageInput.value = '';
      } catch (err) {
        alert('Could not reach the server.');
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    init();
  </script>
</body>
</html>
