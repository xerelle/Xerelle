<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xerelle — Privacy &amp; Safety</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #0F0509;
    color: #F7F0E6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 0;
    margin: 0;
    min-height: 100vh;
  }
  .card { max-width: 460px; width: 100%; }
  .header {
    padding: 24px 20px 8px;
  }
  .header h1 { font-size: 20px; margin: 0 0 4px; }
  .header p { color: #9C8791; font-size: 13px; margin: 0; }

  .section-label {
    padding: 20px 20px 10px;
    color: #9C8791;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .block-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 20px;
    border-bottom: 1px solid #2B0A1F;
  }
  .block-left { min-width: 0; flex: 1; }
  .block-name { font-size: 14.5px; font-weight: 600; margin-bottom: 3px; }
  .block-reason { font-size: 13px; color: #9C8791; line-height: 1.4; margin-bottom: 3px; }
  .block-date { font-size: 11.5px; color: #6B5A62; }
  .unblock-btn {
    flex-shrink: 0;
    margin-left: 12px;
    background: #3A1029;
    border: 1px solid #4A1E36;
    color: #D4A24C;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .unblock-btn:disabled { color: #9C8791; cursor: not-allowed; }

  #loading, #empty, #notfound {
    padding: 60px 20px;
    text-align: center;
    color: #9C8791;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Privacy &amp; Safety</h1>
      <p>Accounts you've blocked.</p>
    </div>

    <div id="loading">Loading...</div>
    <div id="notfound" style="display:none;"></div>
    <div id="empty" style="display:none;">You haven't blocked anyone.</div>
    <div id="blockList"></div>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');
    const loading = document.getElementById('loading');
    const notfound = document.getElementById('notfound');
    const empty = document.getElementById('empty');
    const blockList = document.getElementById('blockList');

    function formatDate(unixSeconds) {
      const date = new Date(unixSeconds * 1000);
      return date.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
    }

    async function loadBlocks() {
      if (!session) {
        loading.style.display = 'none';
        notfound.textContent = 'Log in first.';
        notfound.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/block', {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        const data = await res.json();

        loading.style.display = 'none';

        if (!res.ok) {
          notfound.textContent = data.message || data.error || 'Something went wrong.';
          notfound.style.display = 'block';
          return;
        }

        if (!data.blocks || data.blocks.length === 0) {
          empty.style.display = 'block';
          return;
        }

        data.blocks.forEach((block) => {
          const item = document.createElement('div');
          item.className = 'block-item';

          const label = block.blocked_display_name || block.blocked_username || 'Unknown account';

          item.innerHTML = `
            <div class="block-left">
              <div class="block-name">${label}</div>
              <div class="block-reason">"${block.reason}"</div>
              <div class="block-date">Blocked ${formatDate(block.created_at)}</div>
            </div>
            <button class="unblock-btn" data-id="${block.id}">Unblock</button>
          `;
          blockList.appendChild(item);
        });

        blockList.querySelectorAll('.unblock-btn').forEach((btn) => {
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.textContent = '...';
            try {
              const res = await fetch(`/api/block/${btn.dataset.id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${session.token}` },
              });
              if (res.ok) {
                btn.closest('.block-item').remove();
                if (blockList.children.length === 0) {
                  empty.style.display = 'block';
                }
              } else {
                btn.disabled = false;
                btn.textContent = 'Unblock';
              }
            } catch (err) {
              btn.disabled = false;
              btn.textContent = 'Unblock';
            }
          });
        });
      } catch (err) {
        loading.style.display = 'none';
        notfound.textContent = 'Could not reach the server.';
        notfound.style.display = 'block';
      }
    }

    loadBlocks();
  </script>
</body>
</html>
