<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Privacy &amp; Safety</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    margin: 0;
    min-height: 100vh;
    position: relative;
  }
  nav { display: flex; justify-content: center; padding: 20px; max-width: 460px; width: 100%; }
  nav img { height: 32px; width: auto; }
  .card { max-width: 460px; width: 100%; }
  .header {
    padding: 24px 20px 8px;
  }
  .header h1 { font-size: 20px; margin: 0 0 4px; }
  .header p { color: var(--text-secondary); font-size: 13px; margin: 0; }

  .section-label {
    padding: 20px 20px 10px;
    color: var(--text-secondary);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .block-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .block-left { min-width: 0; flex: 1; }
  .block-name { font-size: 14.5px; font-weight: 600; margin-bottom: 3px; }
  .block-reason { font-size: 13px; color: var(--text-secondary); line-height: 1.4; margin-bottom: 3px; }
  .block-date { font-size: 11.5px; color: var(--text-secondary); }
  .unblock-btn {
    flex-shrink: 0;
    margin-left: 12px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--accent-gold);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .unblock-btn:disabled { color: var(--text-secondary); cursor: not-allowed; }

  #loading, #empty, #notfound {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-secondary);
  }
</style>
</head>
<body>
  <nav>
    <a href="/index.html"><img src="/logo.png" alt="Xerelle"></a>
  </nav>
  <button onclick="xerelleGoBack()" style="position:fixed; top:16px; left:16px; z-index:20; background:var(--bg-surface); border:1px solid var(--border); border-radius:50%; color:var(--text-primary); cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="card">
    <div class="header">
      <h1>Privacy &amp; Safety</h1>
      <p>Accounts you've blocked.</p>
    </div>

    <div id="loading">Loading...</div>
    <div id="notfound" style="display:none;"></div>
    <div id="empty" style="display:none;">You haven't blocked anyone.</div>
    <div id="blockList"></div>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');
    const loading = document.getElementById('loading');
    const notfound = document.getElementById('notfound');
    const empty = document.getElementById('empty');
    const blockList = document.getElementById('blockList');

    function formatDate(unixSeconds) {
      const date = new Date(unixSeconds * 1000);
      return date.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
    }

    async function loadBlocks() {
      if (!session) {
        loading.style.display = 'none';
        notfound.textContent = 'Log in first.';
        notfound.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/block', {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        const data = await res.json();

        loading.style.display = 'none';

        if (!res.ok) {
          notfound.textContent = data.message || data.error || 'Something went wrong.';
          notfound.style.display = 'block';
          return;
        }

        if (!data.blocks || data.blocks.length === 0) {
          empty.style.display = 'block';
          return;
        }

        data.blocks.forEach((block) => {
          const item = document.createElement('div');
          item.className = 'block-item';

          const label = block.blocked_display_name || block.blocked_username || 'Unknown account';

          item.innerHTML = `
            <div class="block-left">
              <div class="block-name">${label}</div>
              <div class="block-reason">"${block.reason}"</div>
              <div class="block-date">Blocked ${formatDate(block.created_at)}</div>
            </div>
            <button class="unblock-btn" data-id="${block.id}">Unblock</button>
          `;
          blockList.appendChild(item);
        });

        blockList.querySelectorAll('.unblock-btn').forEach((btn) => {
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.textContent = '...';
            try {
              const res = await fetch(`/api/block/${btn.dataset.id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${session.token}` },
              });
              if (res.ok) {
                btn.closest('.block-item').remove();
                if (blockList.children.length === 0) {
                  empty.style.display = 'block';
                }
              } else {
                btn.disabled = false;
                btn.textContent = 'Unblock';
              }
            } catch (err) {
              btn.disabled = false;
              btn.textContent = 'Unblock';
            }
          });
        });
      } catch (err) {
        loading.style.display = 'none';
        notfound.textContent = 'Could not reach the server.';
        notfound.style.display = 'block';
      }
    }

    loadBlocks();
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
