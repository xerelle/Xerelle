<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Change Password</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 20px;
    margin: 0;
  }
  .card { max-width: 400px; width: 100%; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p.sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 28px; }
  #whoami { color: var(--accent-gold); font-size: 13px; margin-bottom: 24px; }

  label {
    display: block; font-size: 13px; color: var(--text-tertiary);
    margin-bottom: 6px; margin-top: 16px;
  }
  input {
    width: 100%; box-sizing: border-box;
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; color: var(--text-primary); font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--accent-gold); }

  button {
    width: 100%; margin-top: 26px;
    background: var(--accent-gold); color: var(--border-subtle); font-weight: 600;
    padding: 14px; border-radius: 10px; border: none;
    font-size: 15px; cursor: pointer;
  }
  button:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }

  #message {
    margin-top: 18px; padding: 12px 14px; border-radius: 8px;
    font-size: 14px; display: none; line-height: 1.5;
  }
  #message.success { background: var(--success-bg); color: var(--accent-green); display: block; }
  #message.error { background: var(--danger-bg); color: var(--danger); display: block; }
</style>
</head>
<body>
  <div class="card">
    <h1>Change password</h1>
    <p class="sub">Enter your current password, then choose a new one.</p>
    <div id="whoami"></div>

    <div id="formArea">
      <label for="currentPassword">Current password</label>
      <input type="password" id="currentPassword" required>

      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" required minlength="8">

      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" required minlength="8">

      <button id="saveBtn">Update password</button>
    </div>

    <div id="message"></div>
  </div>

  <script>
    const modelSession = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');
    const subscriberSession = JSON.parse(localStorage.getItem('xerelle_subscriber_session') || 'null');

    // A person could theoretically be logged in as both on the same
    // device — the model session takes priority here since this page is
    // most commonly reached from the model's Profile hub, but either
    // session works correctly on its own.
    const session = modelSession || subscriberSession;
    const accountType = modelSession ? 'model' : 'subscriber';
    const endpoint = accountType === 'model'
      ? '/api/models/change-password'
      : '/api/subscribers/change-password';

    const whoami = document.getElementById('whoami');
    const formArea = document.getElementById('formArea');
    const messageBox = document.getElementById('message');
    const saveBtn = document.getElementById('saveBtn');

    if (!session) {
      whoami.innerHTML = 'You need to log in first.';
      formArea.style.display = 'none';
    } else {
      whoami.textContent = `${session.display_name} (@${session.username})`;
    }

    saveBtn.addEventListener('click', async () => {
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      messageBox.className = '';
      messageBox.textContent = '';

      if (!currentPassword || !newPassword || !confirmPassword) {
        messageBox.className = 'error';
        messageBox.textContent = 'Please fill in all fields.';
        return;
      }
      if (newPassword.length < 8) {
        messageBox.className = 'error';
        messageBox.textContent = 'New password must be at least 8 characters.';
        return;
      }
      if (newPassword !== confirmPassword) {
        messageBox.className = 'error';
        messageBox.textContent = "New passwords don't match.";
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Updating...';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.token}`,
          },
          body: JSON.stringify({
            current_password: currentPassword,
            new_password: newPassword,
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          messageBox.className = 'error';
          messageBox.textContent = data.message || data.error || 'Something went wrong.';
          return;
        }

        messageBox.className = 'success';
        messageBox.textContent = 'Password updated successfully.';
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
      } catch (err) {
        messageBox.className = 'error';
        messageBox.textContent = 'Could not reach the server.';
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Update password';
      }
    });
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
