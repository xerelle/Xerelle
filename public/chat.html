<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<title>Xerelle — Chat</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 0;
    margin: 0;
    height: 100vh;
    overflow: hidden;
  }
  .card {
    max-width: 460px;
    width: 100%;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-primary);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent-gold);
    overflow: hidden;
  }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-circle.has-story { border: 2px solid var(--accent-gold); }
  .header h1 { font-size: 17px; margin: 0; }
  .header .sub { color: var(--text-secondary); font-size: 12.5px; margin-top: 2px; }
  .header-menu-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
  }
  .header-dropdown {
    display: none;
    position: absolute;
    top: 56px;
    right: 20px;
    z-index: 5;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    z-index: 3;
  }
  .header-dropdown.open { display: block; }
  .header-dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 18px;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .header-dropdown button.danger { color: var(--danger); }
  .header-dropdown button:active { background: var(--border); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 10;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--bg-surface-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    max-width: 380px;
    width: 100%;
  }
  .modal-box h2 { font-size: 16px; margin: 0 0 8px; }
  .modal-box p { font-size: 13px; color: var(--text-secondary); margin: 0 0 14px; line-height: 1.5; }
  .modal-box textarea {
    width: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 70px;
  }
  .modal-box textarea:focus { outline: none; border-color: var(--accent-gold); }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .modal-actions button {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal-actions .cancel-btn { background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border); }
  .modal-actions .confirm-btn { background: var(--danger); color: var(--border-subtle); }
  .modal-actions .confirm-btn:disabled { background: var(--border); color: var(--text-secondary); }

  .thread {
    flex: 1;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.4;
  }
  .bubble.subscriber {
    align-self: flex-end;
    background: var(--accent-gold);
    color: var(--border-subtle);
    border-bottom-right-radius: 4px;
  }
  .bubble.model {
    align-self: flex-start;
    background: var(--bg-surface);
    color: var(--text-primary);
    border-bottom-left-radius: 4px;
  }
  .empty-state {
    color: var(--text-secondary);
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
    padding: 0 20px;
  }

  .paywall {
    margin: 10px 20px;
    padding: 14px;
    background: rgba(212,162,76,0.12);
    border: 1px solid var(--accent-gold);
    border-radius: 12px;
    color: var(--accent-gold);
    font-size: 13.5px;
    text-align: center;
    display: none;
  }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-row input {
    flex: 1;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px 16px;
    color: var(--text-primary);
    font-size: 14.5px;
  }
  .input-row input:focus { outline: none; border-color: var(--accent-gold); }
  .input-row button {
    background: var(--accent-gold);
    color: var(--border-subtle);
    font-weight: 600;
    padding: 0 20px;
    border-radius: 20px;
    border: none;
    font-size: 14.5px;
    cursor: pointer;
  }
  .input-row button:disabled {
    background: var(--border);
    color: var(--text-secondary);
    cursor: not-allowed;
  }

  /* Bottom nav bar */
  .nav-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 0 20px;
    border-top: 1px solid var(--border);
    background: var(--bg-primary);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 11px;
    background: none;
    border: none;
    cursor: pointer;
  }
  .nav-item svg { width: 21px; height: 21px; }
  .nav-item.active { color: var(--accent-gold); }

  #loading, #notfound {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-secondary);
  }

  /* Story overlay (for the Update button) */
  .story-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 11;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .story-overlay.open { display: flex; }
  .story-overlay img, .story-overlay video {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
  }
  .story-caption {
    position: absolute;
    bottom: 40px;
    left: 20px;
    right: 20px;
    color: var(--text-primary);
    font-size: 14px;
    text-align: center;
    background: rgba(0,0,0,0.5);
    padding: 10px 14px;
    border-radius: 8px;
  }
  .story-close {
    position: absolute;
    top: 24px;
    right: 24px;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 28px;
    cursor: pointer;
    z-index: 12;
  }
</style>
</head>
<body>
  <div class="card">
    <div id="loading">Loading...</div>
    <div id="notfound" style="display:none;"></div>

    <div id="chatUI" style="display:none; flex-direction:column; flex:1;">
      <div class="header">
        <div class="avatar-circle" id="avatarCircle"></div>
        <div>
          <h1 id="modelName"></h1>
          <div class="sub" id="modelUsername"></div>
        </div>
        <button class="header-menu-btn" id="headerMenuBtn">⋮</button>
      </div>
      <div class="header-dropdown" id="headerDropdown">
        <button id="blockOptionBtn">Block model</button>
        <button class="danger" id="reportOptionBtn">Report model</button>
      </div>

      <div class="thread" id="thread">
        <div class="empty-state" id="emptyState">No messages yet — say hello. Your first message is free.</div>
      </div>

      <div class="paywall" id="paywall">
        You've used your one free message with her. Subscribe to keep talking.
      </div>

      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Type a message..." maxlength="1000">
        <button id="sendBtn">Send</button>
      </div>

      <div class="nav-bar">
        <button class="nav-item active" id="navMessage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Message
        </button>
        <button class="nav-item" id="navUpdate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="4"/><path d="M4 7h3l2-3h6l2 3h3v13H4z"/></svg>
          Update
        </button>
        <button class="nav-item" id="navCall">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          Call
        </button>
      </div>
    </div>
  </div>

  <div class="story-overlay" id="storyOverlay">
    <button class="story-close" id="storyClose">&times;</button>
    <div id="storyMediaContainer"></div>
    <div class="story-caption" id="storyCaption" style="display:none;"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
      <textarea id="modalReason" placeholder="Reason (required)..."></textarea>
      <div class="modal-actions">
        <button class="cancel-btn" id="modalCancelBtn">Cancel</button>
        <button class="confirm-btn" id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const modelUsername = new URLSearchParams(window.location.search).get('u');
    const session = JSON.parse(localStorage.getItem('xerelle_subscriber_session') || 'null');

    const loading = document.getElementById('loading');
    const notfound = document.getElementById('notfound');
    const chatUI = document.getElementById('chatUI');
    const thread = document.getElementById('thread');
    const emptyState = document.getElementById('emptyState');
    const paywall = document.getElementById('paywall');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    let modelId = null;
    let activeStory = null;

    function showNotFound(message) {
      loading.style.display = 'none';
      notfound.textContent = message;
      notfound.style.display = 'block';
    }

    function renderMessage(msg) {
      const bubble = document.createElement('div');
      bubble.className = `bubble ${msg.sender_type}`;
      bubble.textContent = msg.body;
      thread.appendChild(bubble);
    }

    async function init() {
      if (!modelUsername) {
        showNotFound('No model specified. Use a link like chat.html?u=hername');
        return;
      }
      if (!session) {
        showNotFound('Log in as a subscriber first to chat.');
        return;
      }

      try {
        const profileRes = await fetch(`/api/models/${encodeURIComponent(modelUsername)}`, {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        if (!profileRes.ok) {
          showNotFound("This Room doesn't exist, or isn't verified yet.");
          return;
        }
        const profile = await profileRes.json();
        modelId = profile.id;
        activeStory = profile.active_story || null;

        document.getElementById('modelName').textContent = profile.age
          ? `${profile.display_name}, ${profile.age}`
          : profile.display_name;
        document.getElementById('modelUsername').textContent = `@${profile.username}`;

        const avatarCircle = document.getElementById('avatarCircle');
        const initial = profile.display_name.trim().charAt(0).toUpperCase();
        avatarCircle.innerHTML = profile.teaser_media_url
          ? `<img src="${window.xerelleEscapeHtml(profile.teaser_media_url)}" alt="">`
          : initial;
        if (activeStory) {
          avatarCircle.classList.add('has-story');
        }

        const messagesRes = await fetch(`/api/messages/${session.id}/${modelId}`, {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        if (messagesRes.ok) {
          const data = await messagesRes.json();
          if (data.messages && data.messages.length > 0) {
            emptyState.style.display = 'none';
            data.messages.forEach(renderMessage);
          }
        }

        loading.style.display = 'none';
        chatUI.style.display = 'flex';
      } catch (err) {
        showNotFound('Could not reach the server.');
      }
    }

    async function sendMessage() {
      const body = messageInput.value.trim();
      if (!body) return;

      sendBtn.disabled = true;
      paywall.style.display = 'none';

      try {
        const res = await fetch('/api/messages/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sender_type: 'subscriber',
            subscriber_id: session.id,
            model_id: modelId,
            message_body: body,
          }),
        });
        const data = await res.json();

        if (res.status === 402) {
          paywall.style.display = 'block';
          return;
        }
        if (!res.ok) {
          paywall.textContent = data.error || 'Something went wrong.';
          paywall.style.display = 'block';
          return;
        }

        emptyState.style.display = 'none';
        renderMessage({ sender_type: 'subscriber', body });
        messageInput.value = '';
      } catch (err) {
        paywall.textContent = 'Could not reach the server.';
        paywall.style.display = 'block';
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Nav bar: Message is the default view (already showing), Update opens
    // her Story if she has one active, Call is an honest placeholder.
    document.getElementById('navUpdate').addEventListener('click', () => {
      if (!activeStory) {
        alert("She doesn't have an active update right now.");
        return;
      }
      const storyMediaContainer = document.getElementById('storyMediaContainer');
      const storyCaption = document.getElementById('storyCaption');

      storyMediaContainer.innerHTML = activeStory.media_type === 'video'
        ? `<video src="${window.xerelleEscapeHtml(activeStory.media_url)}" autoplay controls></video>`
        : `<img src="${window.xerelleEscapeHtml(activeStory.media_url)}" alt="">`;

      if (activeStory.caption) {
        storyCaption.textContent = activeStory.caption;
        storyCaption.style.display = 'block';
      } else {
        storyCaption.style.display = 'none';
      }

      document.getElementById('storyOverlay').classList.add('open');
    });

    document.getElementById('navCall').addEventListener('click', () => {
      alert('Video calls — coming soon.');
    });

    function closeStory() {
      document.getElementById('storyOverlay').classList.remove('open');
      document.getElementById('storyMediaContainer').innerHTML = '';
    }
    document.getElementById('storyClose').addEventListener('click', closeStory);
    document.getElementById('storyOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('storyOverlay')) closeStory();
    });

    // Header menu (Block / Report)
    const headerMenuBtn = document.getElementById('headerMenuBtn');
    const headerDropdown = document.getElementById('headerDropdown');
    headerMenuBtn.addEventListener('click', () => {
      headerDropdown.classList.toggle('open');
    });

    let pendingAction = null; // 'block' or 'report'

    function openModal(action) {
      pendingAction = action;
      headerDropdown.classList.remove('open');
      document.getElementById('modalTitle').textContent =
        action === 'block' ? 'Block this model?' : 'Report this model';
      document.getElementById('modalDesc').textContent =
        action === 'block'
          ? "You won't be able to message her again, and she won't be able to message you. This requires a reason."
          : "Let us know what's going on. Our team will review it.";
      document.getElementById('modalReason').value = '';
      document.getElementById('modalOverlay').classList.add('open');
    }

    document.getElementById('blockOptionBtn').addEventListener('click', () => openModal('block'));
    document.getElementById('reportOptionBtn').addEventListener('click', () => openModal('report'));

    document.getElementById('modalCancelBtn').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.remove('open');
    });

    document.getElementById('modalConfirmBtn').addEventListener('click', async () => {
      const reason = document.getElementById('modalReason').value.trim();
      if (!reason) {
        alert('A reason is required.');
        return;
      }

      const confirmBtn = document.getElementById('modalConfirmBtn');
      confirmBtn.disabled = true;

      try {
        const endpoint = pendingAction === 'block' ? '/api/block' : '/api/report';
        const payload = pendingAction === 'block'
          ? { blocked_type: 'model', blocked_id: modelId, reason }
          : { reported_type: 'model', reported_id: modelId, reason };

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.token}`,
          },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          alert(data.error || data.message || 'Something went wrong.');
          return;
        }

        document.getElementById('modalOverlay').classList.remove('open');

        if (pendingAction === 'block') {
          alert('Model blocked.');
          window.location.href = '/home.html';
        } else {
          alert(data.message || 'Report submitted.');
        }
      } catch (err) {
        alert('Could not reach the server.');
      } finally {
        confirmBtn.disabled = false;
      }
    });

    init();
  </script>
  <script src="/theme-toggle.js"></script>
</body>
</html>
