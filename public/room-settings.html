<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xerelle — Room Settings</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #0F0509;
    color: #F7F0E6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 20px;
    margin: 0;
  }
  .card { max-width: 420px; width: 100%; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p.sub { color: #9C8791; font-size: 14px; margin-bottom: 28px; }
  #whoami { color: #D4A24C; font-size: 13px; margin-bottom: 24px; }

  label {
    display: block; font-size: 13px; color: #C9B8BF;
    margin-bottom: 6px; margin-top: 16px;
  }
  .price-input-row {
    display: flex;
    align-items: center;
    background: #3A1029;
    border: 1px solid #4A1E36;
    border-radius: 8px;
    padding: 0 14px;
  }
  .price-input-row span {
    color: #9C8791;
    font-size: 15px;
    margin-right: 4px;
  }
  .price-input-row input {
    flex: 1;
    background: none;
    border: none;
    padding: 12px 0;
    color: #F7F0E6;
    font-size: 16px;
  }
  .price-input-row input:focus { outline: none; }
  .price-hint {
    color: #9C8791;
    font-size: 12.5px;
    margin-top: 8px;
    line-height: 1.5;
  }

  button {
    width: 100%;
    margin-top: 26px;
    background: #D4A24C;
    color: #2B0A1F;
    font-weight: 600;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { background: #4A1E36; color: #9C8791; cursor: not-allowed; }

  #message {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
    line-height: 1.5;
  }
  #message.success { background: rgba(27,77,62,0.2); color: #4E9C82; display: block; }
  #message.error { background: rgba(232,139,155,0.15); color: #E88B9B; display: block; }
  a { color: #D4A24C; }
</style>
</head>
<body>
  <div class="card">
    <h1>Room settings</h1>
    <p class="sub">Set your own monthly subscription price.</p>
    <div id="whoami"></div>

    <div id="settingsArea">
      <label for="priceInput">Monthly subscription price</label>
      <div class="price-input-row">
        <span>₦</span>
        <input type="number" id="priceInput" step="500" min="10000">
      </div>
      <div class="price-hint">Minimum ₦10,000. Set it higher if you believe your access is worth more — you're always in control.</div>

      <button id="saveBtn">Save price</button>
    </div>

    <div id="message"></div>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem('xerelle_model_session') || 'null');
    const whoami = document.getElementById('whoami');
    const settingsArea = document.getElementById('settingsArea');
    const priceInput = document.getElementById('priceInput');
    const saveBtn = document.getElementById('saveBtn');
    const messageBox = document.getElementById('message');

    async function init() {
      if (!session) {
        whoami.innerHTML = 'You need to <a href="/login.html">log in</a> first.';
        settingsArea.style.display = 'none';
        return;
      }
      whoami.textContent = `${session.display_name} (@${session.username})`;

      try {
        const res = await fetch(`/api/models/${encodeURIComponent(session.username)}`, {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        if (res.ok) {
          const data = await res.json();
          const currentPriceNaira = (data.subscription_price_kobo || 1000000) / 100;
          priceInput.value = currentPriceNaira;
        }
      } catch (err) {
        // If this fails, the input just stays blank — she can still type a new price.
      }
    }

    saveBtn.addEventListener('click', async () => {
      const priceNaira = parseInt(priceInput.value, 10);

      if (!priceNaira || priceNaira < 10000) {
        messageBox.className = 'error';
        messageBox.textContent = 'Price must be at least ₦10,000.';
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      messageBox.className = '';
      messageBox.textContent = '';

      try {
        const res = await fetch('/api/models/price', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.token}`,
          },
          body: JSON.stringify({ subscription_price_kobo: priceNaira * 100 }),
        });
        const data = await res.json();

        if (!res.ok) {
          messageBox.className = 'error';
          messageBox.textContent = data.message || data.error || 'Something went wrong.';
          return;
        }

        messageBox.className = 'success';
        messageBox.textContent = `Price updated to ₦${priceNaira.toLocaleString()}/mo.`;
      } catch (err) {
        messageBox.className = 'error';
        messageBox.textContent = 'Could not reach the server.';
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save price';
      }
    });

    init();
  </script>
</body>
</html>
