<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xerelle — Chat</title>
<style>
  body {
    background: #0F0509;
    color: #F7F0E6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 0;
    margin: 0;
    height: 100vh;
    overflow: hidden;
  }
  .card {
    max-width: 460px;
    width: 100%;
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
  }
  .header {
    padding: 16px 20px;
    border-bottom: 1px solid #4A1E36;
    flex-shrink: 0;
  }
  .header h1 { font-size: 17px; margin: 0; }
  .header .sub { color: #9C8791; font-size: 12.5px; margin-top: 2px; }

  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.4;
  }
  .bubble.subscriber {
    align-self: flex-end;
    background: #D4A24C;
    color: #2B0A1F;
    border-bottom-right-radius: 4px;
  }
  .bubble.model {
    align-self: flex-start;
    background: #3A1029;
    color: #F7F0E6;
    border-bottom-left-radius: 4px;
  }
  .empty-state {
    color: #9C8791;
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
    padding: 0 20px;
  }

  .paywall {
    margin: 10px 20px;
    padding: 14px;
    background: rgba(212,162,76,0.12);
    border: 1px solid #D4A24C;
    border-radius: 12px;
    color: #D4A24C;
    font-size: 13.5px;
    text-align: center;
    display: none;
  }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid #4A1E36;
    flex-shrink: 0;
  }
  .input-row input {
    flex: 1;
    box-sizing: border-box;
    background: #3A1029;
    border: 1px solid #4A1E36;
    border-radius: 20px;
    padding: 12px 16px;
    color: #F7F0E6;
    font-size: 14.5px;
  }
  .input-row input:focus { outline: none; border-color: #D4A24C; }
  .input-row button {
    background: #D4A24C;
    color: #2B0A1F;
    font-weight: 600;
    padding: 0 20px;
    border-radius: 20px;
    border: none;
    font-size: 14.5px;
    cursor: pointer;
  }
  .input-row button:disabled {
    background: #4A1E36;
    color: #9C8791;
    cursor: not-allowed;
  }

  #loading, #notfound {
    padding: 60px 20px;
    text-align: center;
    color: #9C8791;
  }
</style>
</head>
<body>
  <div class="card">
    <div id="loading">Loading...</div>
    <div id="notfound" style="display:none;"></div>

    <div id="chatUI" style="display:none; flex-direction:column; height:100%;">
      <div class="header">
        <h1 id="modelName"></h1>
        <div class="sub" id="modelUsername"></div>
      </div>

      <div class="thread" id="thread">
        <div class="empty-state" id="emptyState">No messages yet — say hello. Your first message is free.</div>
      </div>

      <div class="paywall" id="paywall">
        You've used your one free message with her. Subscribe to keep talking.
      </div>

      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Type a message..." maxlength="1000">
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script>
    const modelUsername = new URLSearchParams(window.location.search).get('u');
    const session = JSON.parse(localStorage.getItem('xerelle_subscriber_session') || 'null');

    const loading = document.getElementById('loading');
    const notfound = document.getElementById('notfound');
    const chatUI = document.getElementById('chatUI');
    const thread = document.getElementById('thread');
    const emptyState = document.getElementById('emptyState');
    const paywall = document.getElementById('paywall');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    let modelId = null;

    function showNotFound(message) {
      loading.style.display = 'none';
      notfound.textContent = message;
      notfound.style.display = 'block';
    }

    function renderMessage(msg) {
      const bubble = document.createElement('div');
      bubble.className = `bubble ${msg.sender_type}`;
      bubble.textContent = msg.body;
      thread.appendChild(bubble);
    }

    async function init() {
      if (!modelUsername) {
        showNotFound('No model specified. Use a link like chat.html?u=hername');
        return;
      }
      if (!session) {
        showNotFound('Log in as a subscriber first to chat.');
        return;
      }

      try {
        const profileRes = await fetch(`/api/models/${encodeURIComponent(modelUsername)}`, {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        if (!profileRes.ok) {
          showNotFound("This Room doesn't exist, or isn't verified yet.");
          return;
        }
        const profile = await profileRes.json();
        modelId = profile.id;
        document.getElementById('modelName').textContent = profile.display_name;
        document.getElementById('modelUsername').textContent = `@${profile.username}`;

        const messagesRes = await fetch(`/api/messages/${session.id}/${modelId}`, {
          headers: { 'Authorization': `Bearer ${session.token}` },
        });
        if (messagesRes.ok) {
          const data = await messagesRes.json();
          if (data.messages && data.messages.length > 0) {
            emptyState.style.display = 'none';
            data.messages.forEach(renderMessage);
            thread.scrollTop = thread.scrollHeight;
          }
        }

        loading.style.display = 'none';
        chatUI.style.display = 'flex';
      } catch (err) {
        showNotFound('Could not reach the server.');
      }
    }

    async function sendMessage() {
      const body = messageInput.value.trim();
      if (!body) return;

      sendBtn.disabled = true;
      paywall.style.display = 'none';

      try {
        const res = await fetch('/api/messages/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sender_type: 'subscriber',
            subscriber_id: session.id,
            model_id: modelId,
            message_body: body,
          }),
        });
        const data = await res.json();

        if (res.status === 402) {
          paywall.style.display = 'block';
          return;
        }
        if (!res.ok) {
          paywall.textContent = data.error || 'Something went wrong.';
          paywall.style.display = 'block';
          return;
        }

        emptyState.style.display = 'none';
        renderMessage({ sender_type: 'subscriber', body });
        thread.scrollTop = thread.scrollHeight;
        messageInput.value = '';
      } catch (err) {
        paywall.textContent = 'Could not reach the server.';
        paywall.style.display = 'block';
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    init();
  </script>
</body>
</html>
